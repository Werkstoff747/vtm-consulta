<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compendio de Disciplinas V5 - Cartas Imprimibles</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./iconos/drRol.png">
    <!-- Fuentes oficiales V5 -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <!-- PapaParse para leer el CSV de tu Google Sheet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        /* =========================================================
            VARIABLES DE TEMA Y MEDIDAS CON MARGEN DE CORTE (GUILLOTINA)
            Carta final real: 63x88mm | Margen/Sangrado: 1mm por lado | Contenedor total: 65x90mm
           ========================================================= */
        :root {
            --bg-color: #0f0f12;
            --card-bg: #18181c;
            --card-border: #2a2a32;
            --accent-red: #8b0000;
            --accent-crimson: #c92a2a;
            --accent-gold: #c5a059;
            --text-main: #e1e1e6;
            --text-muted: #a0a0b0;
            --tag-bg: #25252e;
            --input-bg: #121215;
            --input-text: #ffffff;
            --header-bg: linear-gradient(180deg, rgba(139,0,0,0.4) 0%, rgba(15,15,18,0.8) 100%);
            --header-border: #8b0000;
            --logo-filter: drop-shadow(0px 2px 8px rgba(201, 42, 42, 0.4));
            
            /* Medidas con marco de corte: Carta 63x88mm + 1mm de margen de corte por lado = 65x90mm totales */
            --card-width: 63mm;
            --card-height: 88mm;
            --bleed: 1mm;
            --full-width: 65mm;
            --full-height: 90mm;
            
            --wrapper-bg: #000;
        }

        body.light-mode {
            --bg-color: #a8a7a4;
            --card-bg: #ffffff;
            --card-border: #bcaba0;
            --accent-red: #8b0000;
            --accent-crimson: #c92a2a;
            --accent-gold: #8d6722;
            --text-main: #1f1f22;
            --text-muted: #555459;
            --tag-bg: #f2f0eb;
            --input-bg: #ffffff;
            --input-text: #1f1f22;
            --header-bg: linear-gradient(180deg, rgba(43,4,8,0.9) 0%, rgba(168,167,164,0.9) 100%);
            --header-border: #7a0000;
            --logo-filter: drop-shadow(0px 2px 8px rgba(201, 42, 42, 0.5));
            --wrapper-bg: #fff;
        }

        /* Estilo de Impresión Ahorro de Tinta / Claro (Print-Friendly) */
        body.print-friendly {
            --wrapper-bg: #fff;
            --card-bg: #fcfbfa;
            --text-main: #1a1a1a;
            --text-muted: #555555;
        }

        body.print-friendly .card-header {
            background: transparent !important;
            border-bottom: 1.5px solid var(--accent-red) !important;
        }

        body.print-friendly .card-discipline {
            color: var(--accent-red) !important;
            font-weight: 900 !important;
            font-size: 0.72rem !important;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact !important; 
            print-color-adjust: exact !important;
        }

        body {
            font-family: 'EB Garamond', serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* CABECERA */
        header {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 20px 20px 20px;
            border-bottom: 2px solid var(--header-border);
            margin-bottom: 25px;
            background: var(--header-bg);
            border-radius: 8px;
            text-align: center;
        }

        .header-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 12px;
            max-width: 100%;
        }

        .header-ank-logo {
            height: 55px;
            width: auto;
            object-fit: contain;
            filter: var(--logo-filter);
        }

        .header-main-logo {
            height: 95px;
            max-width: 85vw;
            width: auto;
            object-fit: contain;
            filter: var(--logo-filter);
        }

        h1.cabecera-principal {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.35rem;
            color: var(--accent-gold);
            font-variant: small-caps;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            line-height: 1.15;
        }

        .theme-btn-header {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .theme-btn-header:hover {
            background-color: var(--accent-red);
            color: #ffffff;
            border-color: var(--accent-crimson);
            transform: scale(1.08);
        }

        /* PANEL DE CONTROL Y PESTAÑAS DE MODO */
        .no-print-controls {
            background-color: #121215 !important;
            border: 1px solid #23232a !important;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .mode-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 15px;
            flex-wrap: wrap;
        }

        .tab-btn {
            font-family: 'Cinzel', serif;
            padding: 8px 16px;
            background: var(--tag-bg);
            color: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .tab-btn.active {
            background: var(--accent-red);
            color: white;
            border-color: var(--accent-gold);
        }

        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            font-family: 'Cinzel', serif;
            padding: 8px 14px;
            background: var(--accent-red);
            color: white;
            border: 1px solid var(--accent-gold);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-crimson);
        }

        select, input {
            font-family: 'Cinzel', serif;
            padding: 8px 14px;
            background-color: var(--input-bg);
            color: var(--input-text);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        select option {
            background-color: var(--card-bg);
            color: #ffffff;
        }

        .btn-secondary {
            background: var(--accent-gold);
            color: #111115;
            font-weight: 600;
        }

        .filters-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .filter-group label {
            display: block;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            margin-bottom: 5px;
            color: var(--accent-gold);
            font-weight: 600;
        }

        .filter-group select, .filter-group input {
            width: 100%;
        }

        /* CONTENEDOR MODO PERSONAJE */
        #builderSection {
            display: none;
            background-color: #121215 !important;
            border: 1px solid #23232a !important;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            color: #ffffff;
        }

        #builderSection p {
            color: var(--text-muted);
        }

        .builder-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .builder-filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.15);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
        }

        .builder-list {
            max-height: 380px;
            overflow-y: auto;
            border: 1px solid var(--card-border);
            padding: 10px;
            border-radius: 6px;
            background: var(--input-bg);
            display: flex;
            flex-direction: column;
            gap: 6px;
            color: #ffffff;
        }

        .builder-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            transition: all 0.2s;
            color: #ffffff;
        }

        .builder-item:hover {
            background: rgba(197, 160, 89, 0.08);
            border-color: rgba(197, 160, 89, 0.3);
        }

        .builder-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
        }

        .builder-item input[type="checkbox"] {
            cursor: pointer;
            accent-color: var(--accent-red);
            width: 18px;
            height: 18px;
        }

        .builder-badge-disc {
            font-size: 0.75rem;
            background: var(--accent-red);
            color: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Cinzel', serif;
        }

        /* CUADRÍCULA ESTRICTA DE CARTAS (65x90mm total con 1mm de margen gris de corte) */
        .cards-grid {
            max-width: calc(var(--full-width) * 3);
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, var(--full-width));
            gap: 0;
            justify-content: center;
        }

        .print-card-wrapper {
            width: var(--full-width);
            height: var(--full-height);
            background: var(--wrapper-bg) !important;
            position: relative;
            border: 0.3mm solid #888; /* Línea gris de corte exterior a 65x90mm */
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .vtm-card {
            width: var(--card-width); /* 63mm exactos de carta final */
            height: var(--card-height); /* 88mm exactos de carta final */
            position: absolute;
            top: var(--bleed); /* 1mm de margen/sangrado superior */
            left: var(--bleed); /* 1mm de margen/sangrado izquierdo */
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 3px solid var(--accent-red);
            padding: 3mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .vtm-card-back {
            width: var(--card-width); /* 63mm exactos de carta final */
            height: var(--card-height); /* 88mm exactos de carta final */
            position: absolute;
            top: var(--bleed); /* 1mm de margen superior */
            left: var(--bleed); /* 1mm de margen izquierdo */
            background-color: var(--card-bg);
            border: 3px solid var(--accent-red);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .vtm-card-back::after, .vtm-card::after {
            content: "";
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 2px;
            border: 1px solid var(--accent-gold);
            pointer-events: none;
        }

        .back-top-logo {
            width: 45mm;
            height: auto;
            object-fit: contain;
            position: absolute;
            top: 8mm;
            left: 50%;
            transform: translateX(-50%);
        }

        .back-center-ank {
            width: 25mm;
            height: 25mm;
            object-fit: contain;
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .discipline-watermark-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30mm;
            height: 30mm;
            object-fit: contain;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
            user-select: none;
        }

        .card-main-content {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            position: relative;
            z-index: 1;
        }

        .card-header {
            background: transparent !important;
            color: var(--accent-red) !important;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--accent-red);
            margin-bottom: 1.2mm;
            padding-bottom: 0.8mm;
        }

        .card-discipline {
            font-family: 'Cinzel', serif;
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-red);
            font-weight: 700;
            line-height: 1;
        }

        .card-titles-container {
            text-align: center;
            margin-bottom: 1mm;
            border-bottom: 1px solid var(--accent-gold);
            padding-bottom: 1px;
        }

        .card-title {
            font-family: 'Cinzel', serif;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.1;
            text-transform: small-caps;
        }

        .card-roll-box {
            font-size: 0.58rem;
            background: rgba(197, 160, 89, 0.08);
            border: 1px solid rgba(197, 160, 89, 0.3);
            padding: 3px 4px;
            border-radius: 3px;
            margin-bottom: 1mm;
            text-align: center;
            line-height: 1.15;
        }

        .card-roll-line-1 {
            font-weight: bold;
            color: var(--accent-crimson);
            font-size: 0.6rem;
        }

        .card-roll-line-2 {
            font-style: italic;
            color: var(--text-muted);
            font-size: 0.48rem;
            margin: 1px 0;
        }

        .card-roll-line-3 {
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.58rem;
        }

        .card-body {
            font-size: 0.62rem;
            line-height: 1.18;
            overflow-y: hidden;
            padding: 1px 2px;
            text-align: justify;
        }

        .card-costs {
            font-size: 0.52rem;
            background: rgba(197, 160, 89, 0.12);
            border: 1px solid var(--accent-gold);
            padding: 2px 4px;
            border-radius: 3px;
            margin-top: auto;
            margin-bottom: 1mm;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }

        .card-costs span span {
            color: var(--accent-gold);
            font-weight: bold;
        }

        .card-footer-container {
            border-top: 1px solid var(--accent-gold);
            padding-top: 0.8mm;
            margin-top: 0;
            position: relative;
            z-index: 1;
        }

        .card-footer-layout {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-level-img {
            width: 5.5mm;
            height: 5.5mm;
            object-fit: contain;
        }

        .card-source-text {
            font-size: 0.42rem;
            color: var(--text-muted);
            font-family: 'Cinzel', serif;
            text-align: center;
            letter-spacing: 0.3px;
        }

        /* BOTÓN FLOTANTE DEFINITIVO (SVG) */
        .floating-nav-container {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 999;
        }

        .floating-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--accent-red);
            border: 1px solid var(--accent-crimson);
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .floating-btn:hover {
            background-color: var(--accent-crimson);
            border-color: var(--accent-gold);
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(139, 0, 0, 0.6);
        }

        #loading {
            text-align: center;
            font-size: 1.1rem;
            color: var(--accent-gold);
            padding: 40px;
            font-family: 'Cinzel', serif;
        }

        .page-break {
            display: none;
        }

        @media print {
            body {
                background: var(--wrapper-bg) !important;
                color: black !important;
                padding: 0 !important;
            }

            .no-print-controls, header, #builderSection, .floating-nav-container {
                display: none !important;
            }

            .cards-grid {
                display: grid !important;
                grid-template-columns: repeat(3, var(--full-width)) !important;
                justify-content: center !important;
                align-content: start !important;
                gap: 0 !important;
                max-width: none !important;
                margin: 0 auto !important;
            }

            .print-card-wrapper {
                border: 0.3mm solid #888 !important;
            }

            .page-break {
                display: block !important;
                page-break-after: always;
                break-after: page;
                height: 0;
                width: 100%;
                grid-column: span 3;
            }

            @page {
                size: A4;
                margin: 0mm;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabecera -->
        <header>
            <button id="themeToggleBtn" class="theme-btn-header" onclick="toggleTheme()" title="Cambiar Tema Día/Noche">🌙</button>
            <div class="header-logos">
                <img src="./iconos/VTM-Ank.png" class="header-ank-logo" alt="Ankh VTM" onerror="this.onerror=null; this.src='iconos/VTM-Ank.png';">
                <img src="./iconos/VTM-Logo-Largo.png" class="header-main-logo" alt="Vampiro La Mascarada" onerror="this.onerror=null; this.src='iconos/VTM-Logo-Largo.png';">
            </div>
            <div class="header-text">
                <h1 class="cabecera-principal">Compendio de Cartas Imprimibles V5</h1>
            </div>
        </header>

        <!-- Panel de Control y Opciones -->
        <div class="no-print-controls">
            <div class="controls-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                <div class="mode-tabs" style="margin-bottom: 0; border-bottom: none; padding-bottom: 0;">
                    <button class="tab-btn active" id="tabCatalog" onclick="switchMode('catalog')">📚 Catálogo General (Filtros)</button>
                    <button class="tab-btn" id="tabBuilder" onclick="switchMode('builder')">🧙‍♂️ Mazo Personalizado</button>
                </div>
                
                <!-- SELECTOR DE ESTILO DE IMPRESIÓN -->
                <div style="display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.2); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent-gold);">
                    <label for="printStyleSelect" style="font-family: 'Cinzel', serif; font-size: 0.8rem; color: var(--accent-gold); white-space: nowrap; margin-bottom: 0;">Estilo Impresión:</label>
                    <select id="printStyleSelect" onchange="togglePrintStyle(this.value)" style="padding: 6px 10px; background: var(--input-bg); color: var(--input-text); border: 1px solid var(--accent-gold); border-radius: 4px; cursor: pointer;">
                        <option value="printfriendly" selected>Print-Friendly (Claro / Ahorro de Tinta)</option>
                        <option value="professional">Profesional (Oscuro)</option>
                    </select>
                </div>
            </div>

            <!-- Botones de Impresión Dúplex y Simplex -->
            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--card-border); display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap;">
                <button class="btn-secondary" onclick="imprimirSimplex()">🖨️ IMPRIMIR ANVERSOS (SIMPLEX)</button>
                <button class="btn-secondary" onclick="imprimirDuplex()">🖨️ IMPRIMIR DÚPLEX (ANVERSO/REVERSO)</button>
            </div>

            <!-- Modo Catálogo General -->
            <div id="catalogSection" style="margin-top: 15px;">
                <div class="filters-row">
                    <div class="filter-group">
                        <label for="filterDiscipline">Filtrar Disciplina:</label>
                        <select id="filterDiscipline" onchange="filterCatalogCards()">
                            <option value="all">Todas las Disciplinas</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filterLevel">Filtrar Nivel:</label>
                        <select id="filterLevel" onchange="filterCatalogCards()">
                            <option value="all">Todos los Niveles</option>
                            <option value="1">Nivel 1</option>
                            <option value="2">Nivel 2</option>
                            <option value="3">Nivel 3</option>
                            <option value="4">Nivel 4</option>
                            <option value="5">Nivel 5</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filterSource">Filtrar Fuente:</label>
                        <select id="filterSource" onchange="filterCatalogCards()">
                            <option value="all">Todas las Fuentes</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="searchCard">Buscar Poder:</label>
                        <input type="text" id="searchCard" placeholder="Nombre o palabra clave..." oninput="filterCatalogCards()">
                    </div>
                </div>
            </div>
        </div>

        <!-- Modo Mazo de Personaje -->
        <div id="builderSection">
            <div class="builder-top-bar">
                <div>
                    <h3 style="font-family: 'Cinzel', serif; color: var(--accent-gold);">Arma el mazo de tu personaje</h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted);">Filtra por disciplina, nivel o fuente para encontrar los poderes rápidamente y marcarlos.</p>
                </div>
                <div class="btn-group">
                    <button type="button" onclick="selectAllBuilder(true)">Seleccionar Visibles</button>
                    <button type="button" onclick="selectAllBuilder(false)" class="tab-btn" style="color:white;">Deseleccionar Visibles</button>
                </div>
            </div>

            <div class="builder-filters">
                <div class="filter-group">
                    <label for="builderFilterDisc">Filtrar Disciplina:</label>
                    <select id="builderFilterDisc" onchange="filterBuilderList()">
                        <option value="all">Todas las Disciplinas</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="builderFilterLvl">Filtrar Nivel:</label>
                    <select id="builderFilterLvl" onchange="filterBuilderList()">
                        <option value="all">Todos los Niveles</option>
                        <option value="1">Nivel 1</option>
                        <option value="2">Nivel 2</option>
                        <option value="3">Nivel 3</option>
                        <option value="4">Nivel 4</option>
                        <option value="5">Nivel 5</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="builderFilterSource">Filtrar Fuente:</label>
                    <select id="builderFilterSource" onchange="filterBuilderList()">
                        <option value="all">Todas las Fuentes</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="builderSearch">Buscar en Mazo:</label>
                    <input type="text" id="builderSearch" placeholder="Nombre del poder..." oninput="filterBuilderList()">
                </div>
            </div>

            <div class="builder-list" id="builderListContainer"></div>
        </div>

        <div id="loading">Cargando cartas desde Google Sheets...</div>

        <!-- Contenedor donde se generan las cartas dinámicamente -->
        <div id="cardsContainer" class="cards-grid"></div>
    </div>

    <!-- Botón flotante definitivo (SVG) -->
    <div class="floating-nav-container">
        <a href="index.html" class="floating-btn" title="Volver al Compendio Principal">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>
        <button class="floating-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'});" title="Subir Arriba">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
        </button>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQaQJuLj6_QRdKghfXWQFV5NThMJF-tXWJDIRJiwShVfbusDaCsQbHL-ZFHL-NaB4DF9MCllinL6RfA/pub?gid=0&single=true&output=csv';
        let allDisciplinesData = [];
        let currentMode = 'catalog'; 
        let selectedCharacterPowers = new Set();

        const ICONOS_MAP = {
            'animalismo': 'Animalism_symbol.png', 'auspex': 'Auspex_symbol.png', 'celeridad': 'Celerity_symbol.png',
            'dominación': 'Dominate_symbol.png', 'fortaleza': 'Fortitude_symbol.png', 'hechicería de sangre': 'Blood_Sorcery_symbol.png',
            'ofuscación': 'Obfuscate_symbol.png', 'olvido': 'Oblivion_symbol.png', 'potencia': 'Potence_symbol.png',
            'presencia': 'Presence_symbol.png', 'protean': 'Protean_symbol.png', 'alquimia de sangre débil': 'Alchemy_symbol.png'
        };

        function initTheme() {
            const savedTheme = localStorage.getItem('vtm-theme');
            const themeBtn = document.getElementById('themeToggleBtn');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
                if (themeBtn) themeBtn.textContent = '☀️';
            } else {
                document.body.classList.remove('light-mode');
                if (themeBtn) themeBtn.textContent = '🌙';
            }
        }

        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('themeToggleBtn');
            body.classList.toggle('light-mode');

            if (body.classList.contains('light-mode')) {
                themeBtn.textContent = '☀️';
                localStorage.setItem('vtm-theme', 'light');
            } else {
                themeBtn.textContent = '🌙';
                localStorage.setItem('vtm-theme', 'dark');
            }
        }

        function togglePrintStyle(style) {
            const select = document.getElementById('printStyleSelect');
            if (select) select.value = style;

            if (style === 'professional') {
                window.location.href = 'imprenta.html';
            } else if (style === 'printfriendly') {
                document.body.classList.add('print-friendly');
            } else {
                document.body.classList.remove('print-friendly');
            }
            renderActiveMode();
        }

        window.onload = function() {
            initTheme();
            togglePrintStyle('printfriendly');

            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    allDisciplinesData = results.data.filter(row => {
                        const nombre = (row['Nombre Poder'] || row['Nombre'] || '').trim();
                        return nombre && nombre.toLowerCase() !== 'nombre poder';
                    });

                    document.getElementById('loading').style.display = 'none';

                    allDisciplinesData.sort((a, b) => {
                        let lvlA = parseInt(a['Nivel'] || 1, 10);
                        let lvlB = parseInt(b['Nivel'] || 1, 10);
                        if (lvlA !== lvlB) return lvlA - lvlB;
                        return (a['Nombre Poder'] || '').localeCompare(b['Nombre Poder']);
                    });

                    populateFilters(allDisciplinesData);
                    populateBuilderList(allDisciplinesData);
                    renderActiveMode();
                },
                error: function(err) {
                    console.error("Error al cargar Google Sheets:", err);
                    document.getElementById('loading').textContent = "Error al cargar los datos del compendio.";
                }
            });
        };

        function switchMode(mode) {
            currentMode = mode;
            const catalogSec = document.getElementById('catalogSection');
            const builderSec = document.getElementById('builderSection');
            const tabCat = document.getElementById('tabCatalog');
            const tabBld = document.getElementById('tabBuilder');

            tabCat.classList.remove('active');
            tabBld.classList.remove('active');

            if (mode === 'catalog') {
                catalogSec.style.display = 'block';
                builderSec.style.display = 'none';
                tabCat.classList.add('active');
            } else if (mode === 'builder') {
                catalogSec.style.display = 'none';
                builderSec.style.display = 'block';
                tabBld.classList.add('active');
            }
            renderActiveMode();
        }

        function populateFilters(data) {
            const disciplinesSet = new Set();
            const sourcesSet = new Set();

            data.forEach(row => {
                const disc = row['Disciplina'] || row['DISCIPLINA'];
                if (disc) disciplinesSet.add(disc.trim());

                const source = row['Fuente_Libro'] || row['Fuente'];
                if (source && source.trim() !== '-') sourcesSet.add(source.trim());
            });

            const selectDisc = document.getElementById('filterDiscipline');
            const builderDisc = document.getElementById('builderFilterDisc');
            
            Array.from(disciplinesSet).sort().forEach(disc => {
                const opt1 = document.createElement('option');
                opt1.value = disc.toLowerCase();
                opt1.textContent = disc;
                selectDisc.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = disc.toLowerCase();
                opt2.textContent = disc;
                builderDisc.appendChild(opt2);
            });

            const selectSource = document.getElementById('filterSource');
            const builderSource = document.getElementById('builderFilterSource');

            Array.from(sourcesSet).sort().forEach(src => {
                const opt1 = document.createElement('option');
                opt1.value = src.toLowerCase();
                opt1.textContent = src;
                selectSource.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = src.toLowerCase();
                opt2.textContent = src;
                builderSource.appendChild(opt2);
            });
        }

        function populateBuilderList(data) {
            const container = document.getElementById('builderListContainer');
            container.innerHTML = '';

            data.forEach((row, index) => {
                const name = row['Nombre Poder'] || row['Nombre'] || 'Sin Nombre';
                const discipline = row['Disciplina'] || 'General';
                const level = (row['Nivel'] || '1').trim();
                const source = (row['Fuente_Libro'] || row['Fuente'] || 'V5').trim();
                const uniqueId = `power_${index}`;
                const isChecked = selectedCharacterPowers.has(name) ? 'checked' : '';

                const item = document.createElement('div');
                item.className = 'builder-row-item';
                item.setAttribute('data-disc', discipline.toLowerCase());
                item.setAttribute('data-level', level);
                item.setAttribute('data-source', source.toLowerCase());
                item.setAttribute('data-name', name.toLowerCase());

                item.innerHTML = `
                    <label class="builder-item" for="${uniqueId}" style="width: 100%; margin: 0; color: #ffffff;">
                        <div class="builder-item-left">
                            <input type="checkbox" id="${uniqueId}" value="${name}" ${isChecked} onchange="toggleBuilderPower('${name.replace(/'/g, "\\'")}', this.checked)">
                            <span><strong>${name}</strong> <span style="font-size:0.75rem; color:var(--text-muted);">(${source})</span></span>
                        </div>
                        <div>
                            <span class="builder-badge-disc">${discipline} (Nivel ${level})</span>
                        </div>
                    </label>
                `;
                container.appendChild(item);
            });
        }

        function filterBuilderList() {
            const discFilter = document.getElementById('builderFilterDisc').value;
            const lvlFilter = document.getElementById('builderFilterLvl').value;
            const sourceFilter = document.getElementById('builderFilterSource').value;
            const searchFilter = document.getElementById('builderSearch').value.toLowerCase().trim();

            const rows = document.querySelectorAll('.builder-row-item');
            rows.forEach(row => {
                const disc = row.getAttribute('data-disc');
                const level = row.getAttribute('data-level');
                const source = row.getAttribute('data-source');
                const name = row.getAttribute('data-name');

                const matchesDisc = (discFilter === 'all' || disc.includes(discFilter));
                const matchesLvl = (lvlFilter === 'all' || level === lvlFilter);
                const matchesSource = (sourceFilter === 'all' || source.includes(sourceFilter));
                const matchesSearch = (!searchQuery || name.includes(searchQuery) || fullText.includes(searchQuery));

                if (matchesDisc && matchesLvl && matchesSource && matchesSearch) {
                    row.style.display = 'block';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        function toggleBuilderPower(name, isChecked) {
            if (isChecked) {
                selectedCharacterPowers.add(name);
            } else {
                selectedCharacterPowers.delete(name);
            }
            if (currentMode === 'builder') {
                renderActiveMode();
            }
        }

        function selectAllBuilder(select) {
            const visibleRows = document.querySelectorAll('.builder-row-item');
            visibleRows.forEach(row => {
                if (row.style.display !== 'none') {
                    const cb = row.querySelector('input[type="checkbox"]');
                    if (cb) {
                        cb.checked = select;
                        const name = cb.value;
                        if (select) {
                            selectedCharacterPowers.add(name);
                        } else {
                            selectedCharacterPowers.delete(name);
                        }
                    }
                }
            });
            if (currentMode === 'builder') {
                renderActiveMode();
            }
        }

        function renderActiveMode() {
            if (currentMode === 'catalog') {
                filterCatalogCards();
            } else if (currentMode === 'builder') {
                renderSelectedBuilderCards();
            }
        }

        function createCardElement(row) {
            const name = row['Nombre Poder'] || row['Nombre'] || 'Sin Nombre';
            const discipline = row['Disciplina'] || 'General';
            let level = (row['Nivel'] || '1').trim();
            
            if (!['1', '2', '3', '4', '5'].includes(level)) {
                level = '1';
            }
            
            const pool = (row['Reserva de Dados'] || row['Reserva de dados'] || row['Tirada'] || '').trim();
            const opposition = (row['Reserva Oposición'] || row['Reserva Oposicion'] || row['Reserva oposicion'] || '').trim();
            
            const cost = row['Controles de Ansia'] || row['Coste'] || 'Ninguno';
            const duration = row['Duracion'] || row['Duración'] || 'Escena';
            const desc = row['Descripción'] || row['DESCRIPCION'] || 'Sin descripción disponible.';
            
            const sourceBook = row['Fuente_Libro'] || row['Fuente'] || 'V5';
            const sourcePage = row['Fuente_Pag'] || row['Página'] || '';

            const discKey = discipline.toLowerCase().trim();
            const archivoIcono = ICONOS_MAP[discKey];
            let watermarkHTML = '';
            let cornerIconHTML = '';
            if (archivoIcono) {
                watermarkHTML = `<img src="./iconos/${archivoIcono}" class="discipline-watermark-img" alt="" onerror="this.style.display='none'">`;
                cornerIconHTML = `<img src="./iconos/${archivoIcono}" class="discipline-watermark-img" alt="${discipline}" style="position:static; width:5.5mm; height:5.5mm; opacity:1; transform:none;" onerror="this.style.display='none'">`;
            }

            const levelImgHTML = `<img src="./iconos/${level}_symbol.png" class="card-level-img" alt="Nivel ${level}" onerror="this.style.display='none'">`;

            let rollBoxHTML = '';
            const oppositionLower = opposition.toLowerCase();
            const isSinOposicion = !opposition || opposition === '-' || oppositionLower === 'sin oposición' || oppositionLower === 'sin oposicion';

            if (pool && pool !== '-') {
                if (isSinOposicion) {
                    rollBoxHTML = `
                        <div class="card-roll-box">
                            <div class="card-roll-line-1">${pool}</div>
                        </div>
                    `;
                } else {
                    rollBoxHTML = `
                        <div class="card-roll-box">
                            <div class="card-roll-line-1">${pool}</div>
                            <div class="card-roll-line-2">vs.</div>
                            <div class="card-roll-line-3">${opposition}</div>
                        </div>
                    `;
                }
            } else {
                rollBoxHTML = `
                    <div class="card-roll-box">
                        <div class="card-roll-line-1">Sin tirada</div>
                    </div>
                `;
            }

            let sourceDisplay = sourceBook;
            if (sourcePage && sourcePage.trim() !== '-' && sourcePage.trim() !== '') {
                sourceDisplay += ` (pág. ${sourcePage})`;
            }

            const wrapper = document.createElement('div');
            wrapper.className = 'print-card-wrapper';

            wrapper.innerHTML = `
                <div class="vtm-card">
                    ${watermarkHTML}
                    <div class="card-main-content">
                        <div class="card-header">
                            <span class="card-discipline">${discipline}</span>
                        </div>
                        <div class="card-titles-container">
                            <div class="card-title">${name}</div>
                        </div>
                        ${rollBoxHTML}
                        <div class="card-body">
                            ${desc}
                        </div>
                        <div class="card-costs">
                            <span>Coste: <span>${cost}</span></span>
                            <span>Duración: <span>${duration}</span></span>
                        </div>
                    </div>
                    <div class="card-footer-container">
                        <div class="card-footer-layout">
                            <div>${levelImgHTML}</div>
                            <div class="card-source-text">${sourceDisplay}</div>
                            <div>${cornerIconHTML}</div>
                        </div>
                    </div>
                </div>
            `;
            return wrapper;
        }

        function filterCatalogCards() {
            if (currentMode !== 'catalog') return;

            const selectedDisc = document.getElementById('filterDiscipline').value;
            const selectedLevel = document.getElementById('filterLevel').value;
            const selectedSource = document.getElementById('filterSource').value;
            const searchQuery = document.getElementById('searchCard').value.toLowerCase();

            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            const filteredData = allDisciplinesData.filter(row => {
                const discipline = (row['Disciplina'] || 'General').toLowerCase().trim();
                let level = (row['Nivel'] || '1').trim();
                const source = (row['Fuente_Libro'] || row['Fuente'] || 'V5').toLowerCase().trim();
                const name = (row['Nombre Poder'] || row['Nombre'] || '').toLowerCase();
                const fullText = Object.values(row).join(' ').toLowerCase();

                const matchesDisc = (selectedDisc === 'all' || discipline.includes(selectedDisc));
                const matchesLevel = (selectedLevel === 'all' || level === selectedLevel);
                const matchesSource = (selectedSource === 'all' || source.includes(selectedSource));
                const matchesSearch = (!searchQuery || name.includes(searchQuery) || fullText.includes(searchQuery));

                return matchesDisc && matchesLevel && matchesSource && matchesSearch;
            });

            filteredData.forEach(row => {
                container.appendChild(createCardElement(row));
            });
        }

        function renderSelectedBuilderCards() {
            if (currentMode !== 'builder') return;

            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            const selectedData = allDisciplinesData.filter(row => {
                const name = row['Nombre Poder'] || row['Nombre'] || '';
                return selectedCharacterPowers.has(name);
            });

            selectedData.forEach(row => {
                container.appendChild(createCardElement(row));
            });
        }

        function obtenerCartasActivas() {
            if (currentMode === 'builder') {
                return allDisciplinesData.filter(row => {
                    const name = row['Nombre Poder'] || row['Nombre'] || '';
                    return selectedCharacterPowers.has(name);
                });
            } else {
                const selectedDisc = document.getElementById('filterDiscipline').value;
                const selectedLevel = document.getElementById('filterLevel').value;
                const selectedSource = document.getElementById('filterSource').value;
                const searchQuery = document.getElementById('searchCard').value.toLowerCase();

                return allDisciplinesData.filter(row => {
                    const discipline = (row['Disciplina'] || 'General').toLowerCase().trim();
                    let level = (row['Nivel'] || '1').trim();
                    const source = (row['Fuente_Libro'] || row['Fuente'] || 'V5').toLowerCase().trim();
                    const name = (row['Nombre Poder'] || row['Nombre'] || '').toLowerCase();
                    const fullText = Object.values(row).join(' ').toLowerCase();

                    const matchesDisc = (selectedDisc === 'all' || discipline.includes(selectedDisc));
                    const matchesLevel = (selectedLevel === 'all' || level === selectedLevel);
                    const matchesSource = (selectedSource === 'all' || source.includes(selectedSource));
                    const matchesSearch = (!searchQuery || name.includes(searchQuery) || fullText.includes(searchQuery));

                    return matchesDisc && matchesLevel && matchesSource && matchesSearch;
                });
            }
        }

        /* FUNCIÓN 1: IMPRESIÓN SIMPLEX */
        function imprimirSimplex() {
            const cartas = obtenerCartasActivas();
            if (cartas.length === 0) {
                alert("No hay cartas seleccionadas o visibles para imprimir.");
                return;
            }

            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            cartas.forEach(row => container.appendChild(createCardElement(row)));

            setTimeout(() => { window.print(); }, 300);
        }

        /* FUNCIÓN 2: IMPRESIÓN DÚPLEX INTERCALADA POR PÁGINAS (BLOQUES DE 9) */
        function imprimirDuplex() {
            const cartas = obtenerCartasActivas();
            if (cartas.length === 0) {
                alert("No hay cartas seleccionadas o visibles para imprimir.");
                return;
            }

            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            const chunkSize = 9;
            const totalPaginas = Math.ceil(cartas.length / chunkSize);

            const isPrintFriendly = document.body.classList.contains('print-friendly');
            const logoLargoFile = isPrintFriendly ? 'VTM-Logo-Largo-N.png' : 'VTM-Logo-Largo.png';
            const logoAnkFile = isPrintFriendly ? 'VTM-Ank-N.png' : 'VTM-Ank.png';

            for (let p = 0; p < totalPaginas; p++) {
                const inicio = p * chunkSize;
                const fin = Math.min(inicio + chunkSize, cartas.length);
                const chunk = cartas.slice(inicio, fin);

                // 1. Renderizar Anversos de la página
                chunk.forEach(row => container.appendChild(createCardElement(row)));

                // Rellenar espacios vacíos si la página tiene menos de 9 cartas
                const resto = chunkSize - chunk.length;
                if (resto !== 0) {
                    for (let r = 0; r < resto; r++) {
                        const emptyWrapper = document.createElement('div');
                        emptyWrapper.className = 'print-card-wrapper';
                        emptyWrapper.style.visibility = 'hidden';
                        container.appendChild(emptyWrapper);
                    }
                }

                // Salto de página para forzar que los reversos vayan en la hoja posterior
                const break1 = document.createElement('div');
                break1.className = 'page-break';
                container.appendChild(break1);

                // 2. Renderizar exactamente 9 Reversos para el reverso de la página A4
                for (let j = 0; j < chunkSize; j++) {
                    const wrapBack = document.createElement('div');
                    wrapBack.className = 'print-card-wrapper';
                    wrapBack.innerHTML = `
                        <div class="vtm-card-back">
                            <img src="./iconos/${logoLargoFile}" class="back-top-logo" alt="Logo" onerror="this.src='./iconos/VTM-Logo-Largo.png'">
                            <img src="./iconos/${logoAnkFile}" class="back-center-ank" alt="Ankh" onerror="this.style.display='none'">
                        </div>
                    `;
                    container.appendChild(wrapBack);
                }

                // Salto de página para el siguiente bloque de anversos (si lo hay)
                if (p < totalPaginas - 1) {
                    const break2 = document.createElement('div');
                    break2.className = 'page-break';
                    container.appendChild(break2);
                }
            }

            setTimeout(() => { window.print(); }, 300);
        }
    </script>

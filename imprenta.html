<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Edición Imprenta Profesional - V5</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --card-w: 63mm; --card-h: 88mm;
            --bleed: 3mm;
            --full-w: 69mm; --full-h: 94mm;
        }

        body { background: #1a1a1a; margin: 0; padding: 10mm; display: flex; justify-content: center; }
        #printArea { display: grid; grid-template-columns: repeat(3, var(--full-w)); gap: 0; }

        /* Contenedor de Sangrado */
        .print-card-wrapper {
            width: var(--full-w); height: var(--full-h);
            background: black; position: relative;
        }

        /* La Carta (Estilo Vampírico sobre Negro) */
        .vtm-card {
            width: var(--card-w); height: var(--card-h);
            position: absolute; top: var(--bleed); left: var(--bleed);
            background: #050505; color: #e1e1e6;
            padding: 3.5mm; display: flex; flex-direction: column;
            border: 1px solid #333; overflow: hidden;
        }

        /* IMPORTAMOS TUS ESTILOS ORIGINALES ADAPTADOS */
        .card-title { font-family: 'Cinzel', serif; font-size: 0.9rem; color: #c5a059; text-align: center; font-weight: 700; margin-bottom: 2mm; }
        .card-body { font-family: 'EB Garamond', serif; font-size: 0.7rem; color: #ccc; text-align: justify; line-height: 1.2; }
        .card-costs { font-size: 0.6rem; color: #c5a059; margin-top: auto; border-top: 1px solid #333; padding-top: 1.5mm; }
        .discipline-watermark-img { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30mm; opacity: 0.1; }
        
        @media print {
            body { background: white; padding: 0; }
            .print-card-wrapper { outline: none; }
        }
    </style>
</head>
<body>

    <div id="printArea"></div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQaQJuLj6_QRdKghfXWQFV5NThMJF-tXWJDIRJiwShVfbusDaCsQbHL-ZFHL-NaB4DF9MCllinL6RfA/pub?gid=0&single=true&output=csv';
        const ICONOS_MAP = {
            'animalismo': 'Animalism_symbol.png', 'auspex': 'Auspex_symbol.png', 'celeridad': 'Celerity_symbol.png',
            'dominación': 'Dominate_symbol.png', 'fortaleza': 'Fortitude_symbol.png', 'hechicería de sangre': 'Blood_Sorcery_symbol.png',
            'ofuscación': 'Obfuscate_symbol.png', 'olvido': 'Oblivion_symbol.png', 'potencia': 'Potence_symbol.png',
            'presencia': 'Presence_symbol.png', 'protean': 'Protean_symbol.png', 'alquimia de sangre débil': 'Alchemy_symbol.png'
        };

        Papa.parse(CSV_URL, {
            download: true, header: true, complete: function(results) {
                const container = document.getElementById('printArea');
                results.data.forEach(row => {
                    if (!(row['Nombre Poder'] || row['Nombre'])) return;

                    const disc = (row['Disciplina'] || '').toLowerCase().trim();
                    const iconPath = ICONOS_MAP[disc] ? `<img src="./iconos/${ICONOS_MAP[disc]}" class="discipline-watermark-img">` : '';

                    const wrapper = document.createElement('div');
                    wrapper.className = 'print-card-wrapper';
                    
                    wrapper.innerHTML = `
                        <div class="vtm-card">
                            ${iconPath}
                            <div class="card-title">${row['Nombre Poder'] || row['Nombre']}</div>
                            <div class="card-body">${row['Descripción'] || ''}</div>
                            <div class="card-costs">Coste: ${row['Coste'] || '-'} | Nivel: ${row['Nivel'] || '-'}</div>
                        </div>
                    `;
                    container.appendChild(wrapper);
                });
            }
        });
    </script>
</body>
</html>

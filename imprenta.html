<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edición Imprenta Profesional - Compendio V5</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./iconos/drRol.png">
    <!-- Fuentes oficiales V5 -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <!-- PapaParse para leer el CSV de tu Google Sheet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        /* =========================================================
            VARIABLES Y ESTILOS DE IMPRESIÓN CON SANGRADO (BLEED)
           ========================================================= */
        * { 
            -webkit-print-color-adjust: exact !important; 
            print-color-adjust: exact !important; 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }

        :root {
            --card-w: 63mm; 
            --card-h: 88mm;
            --bleed: 3mm;
            --full-w: 69mm; 
            --full-h: 94mm;
            --border-red: #8b0000;
            --border-gold: #c5a059;
            --bg-dark: #121212;
            --text-main: #e1e1e6;
            --text-muted: #a0a0b0;
            --tag-bg: #25252e;
            --input-bg: #0f0f12;
        }

        body {
            font-family: 'EB Garamond', serif;
            background-color: #1a1a1a;
            color: var(--text-main);
            padding: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* CABECERA */
        header {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 20px;
            border-bottom: 2px solid var(--border-red);
            margin-bottom: 25px;
            background: linear-gradient(180deg, rgba(139,0,0,0.3) 0%, rgba(15,15,18,0) 100%);
            border-radius: 8px;
            text-align: center;
        }

        h1.cabecera-principal {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.35rem;
            color: var(--border-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* PANEL DE CONTROL Y PESTAÑAS */
        .no-print-controls {
            background: var(--bg-dark);
            border: 1px solid #333;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .mode-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            flex-wrap: wrap;
        }

        .tab-btn {
            font-family: 'Cinzel', serif;
            padding: 8px 16px;
            background: var(--tag-bg);
            color: var(--text-muted);
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .tab-btn.active {
            background: var(--border-red);
            color: white;
            border-color: var(--border-gold);
        }

        button, select, input {
            font-family: 'Cinzel', serif;
            padding: 8px 14px;
            background: var(--border-red);
            color: white;
            border: 1px solid var(--border-gold);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        button:hover, select:hover { background: #a51d1d; }

        .btn-secondary {
            background: var(--border-gold);
            color: #111;
            font-weight: 600;
        }

        .filters-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .filter-group label {
            display: block;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            margin-bottom: 5px;
            color: var(--border-gold);
            font-weight: 600;
        }

        .filter-group select, .filter-group input {
            width: 100%;
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid #444;
            padding: 8px;
        }

        #builderSection {
            display: none;
            background: var(--bg-dark);
            border: 1px solid #333;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .builder-list {
            max-height: 380px;
            overflow-y: auto;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 6px;
            background: var(--input-bg);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .builder-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
        }

        /* =========================================================
            ESTILOS DE CARTA PARA IMPRENTA (CON SANGRADO Y LÍNEA DE CORTE)
           ========================================================= */
        .cards-grid {
            max-width: calc(var(--full-w) * 3);
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, var(--full-w));
            gap: 0;
            justify-content: center;
        }

        /* Contenedor de Sangrado (Bleed 3mm) con línea de corte visible en gris claro */
        .print-card-wrapper {
            width: var(--full-w);
            height: var(--full-h);
            background: #000 !important;
            position: relative;
            border: 0.2mm solid #777; /* Línea gris de guía de corte */
            page-break-inside: avoid;
            break-inside: avoid;
        }

        /* Checkbox de selección rápida sobre la tarjeta (para pantalla) */
        .card-select-checkbox {
            position: absolute;
            top: 4mm;
            right: 4mm;
            width: 5mm;
            height: 5mm;
            z-index: 10;
            cursor: pointer;
            accent-color: var(--border-red);
        }

        /* Estado visual cuando la carta está seleccionada */
        .print-card-wrapper.selected {
            outline: 2px solid var(--border-gold);
        }

        /* CARTA DE LUJO (MEDIDAS ORIGINALES) */
        .vtm-card {
            width: var(--card-w);
            height: var(--card-h);
            position: absolute;
            top: var(--bleed);
            left: var(--bleed);
            background: var(--bg-dark) !important;
            color: #e1e1e6 !important;
            border: 3px solid var(--border-red);
            padding: 3.5mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .vtm-card::after {
            content: "";
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 2px;
            border: 1px solid var(--border-gold);
            pointer-events: none;
        }

        /* TRASERA ORIGINAL */
        .vtm-card-back {
            width: var(--card-w);
            height: var(--card-h);
            position: absolute;
            top: var(--bleed);
            left: var(--bleed);
            background-color: var(--bg-dark) !important;
            border: 3px solid var(--border-red);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .vtm-card-back::after {
            content: "";
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 2px;
            border: 1px solid var(--border-gold);
            pointer-events: none;
        }

        .back-top-logo {
            width: 52mm;
            height: auto;
            object-fit: contain;
            position: absolute;
            top: 10mm;
            left: 50%;
            transform: translateX(-50%);
        }

        .back-center-ank {
            width: 32mm;
            height: 32mm;
            object-fit: contain;
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* ELEMENTOS INTERNOS DE LA CARTA */
        .discipline-watermark-img {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 35mm; height: 35mm;
            object-fit: contain;
            opacity: 0.12;
            pointer-events: none;
        }

        .card-main-content { display: flex; flex-direction: column; flex-grow: 1; position: relative; z-index: 1; }
        
        .card-header { 
            background: #8b0000 !important; 
            color: #fff !important; 
            height: 6mm; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 1px solid var(--border-gold); 
            margin-bottom: 1.5mm; 
            font-family: 'Cinzel', serif; 
            font-size: 0.62rem; 
            text-transform: uppercase; 
        }

        .card-title { 
            font-family: 'Cinzel', serif; 
            color: #fff !important; 
            font-size: 0.9rem; 
            font-weight: 700; 
            text-align: center; 
            margin-bottom: 1.5mm; 
            border-bottom: 1px solid var(--border-gold);
            padding-bottom: 2px;
        }

        .card-roll-box { 
            background: rgba(0,0,0,0.4); 
            border: 1px solid var(--border-gold); 
            padding: 3px 6px; 
            margin-bottom: 1.5mm; 
            text-align: center; 
            font-size: 0.68rem; 
            color: #ffffff !important; 
            font-weight: bold; 
        }

        .card-body { 
            font-family: 'EB Garamond', serif; 
            font-size: clamp(5pt, 7pt, 8pt); 
            line-height: 1.1; 
            color: #ccc !important; 
            text-align: justify; 
            overflow: hidden; 
        }

        .card-costs { 
            font-size: 0.6rem; 
            background: rgba(0,0,0,0.4); 
            border: 1px solid var(--border-gold); 
            padding: 3px 5px; 
            margin-top: auto; 
            margin-bottom: 1.5mm;
            display: flex; 
            justify-content: space-between; 
            color: var(--border-gold); 
            font-weight: 600;
        }

        .card-footer-container { border-top: 1px solid var(--border-gold); padding-top: 1.5mm; position: relative; z-index: 1; }
        .card-footer-layout { display: flex; justify-content: space-between; align-items: center; }
        .card-level-img, .card-discipline-icon-img { width: 6.5mm; height: 6.5mm; object-fit: contain; }
        .card-source-text { font-size: 0.5rem; color: var(--text-muted); font-family: 'Cinzel', serif; text-align: center; }

        #loading { text-align: center; font-size: 1.1rem; color: var(--border-gold); padding: 40px; font-family: 'Cinzel', serif; }
        .page-break { display: none; }

        /* REGLAS DE IMPRESIÓN */
        @media print {
            body { background: #000 !important; padding: 0 !important; }
            .no-print-controls, header { display: none !important; }
            .card-select-checkbox { display: none !important; } /* Ocultar checkbox al imprimir */
            .cards-grid { 
                display: grid !important; 
                grid-template-columns: repeat(3, var(--full-w)) !important; 
                justify-content: center !important;
                align-content: center !important;
            }
            .print-card-wrapper { 
                border: 0.2mm solid #777 !important; 
            }
            .page-break { 
                display: block !important; 
                page-break-after: always; 
                break-after: page; 
                height: 0; 
                width: 100%; 
                grid-column: span 3; 
            }
            @page { 
                size: A4; 
                margin: 0mm; 
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 class="cabecera-principal">Edición Imprenta Profesional - V5</h1>
        </header>

        <!-- CONTROLES Y FILTROS -->
        <div class="no-print-controls">
            <div class="mode-tabs">
                <button class="tab-btn active" id="tabCatalog" onclick="switchMode('catalog')">📚 Catálogo General (Filtros)</button>
                <button class="tab-btn" id="tabBuilder" onclick="switchMode('builder')">🧙‍♂️ Mazo Personalizado</button>
            </div>

            <div style="margin-bottom: 15px; display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap;">
                <div id="selectionStatus" style="font-family: 'Cinzel', serif; font-size: 0.85rem; color: var(--border-gold);">
                    Mostrando todas las cartas visibles (Ninguna seleccionada individualmente)
                </div>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button type="button" onclick="clearManualSelection()" style="background: #333; font-size: 0.75rem;">Limpiar Selección</button>
                    <button class="btn-secondary" onclick="imprimirSimplex()">🖨️ IMPRIMIR ANVERSOS (SIMPLEX)</button>
                    <button class="btn-secondary" onclick="imprimirDuplex()">🖨️ IMPRIMIR DÚPLEX (ANVERSO/REVERSO)</button>
                </div>
            </div>

            <div id="catalogSection">
                <div class="filters-row">
                    <div class="filter-group">
                        <label for="filterDiscipline">Filtrar Disciplina:</label>
                        <select id="filterDiscipline" onchange="filterCatalogCards()"><option value="all">Todas</option></select>
                    </div>
                    <div class="filter-group">
                        <label for="filterLevel">Filtrar Nivel:</label>
                        <select id="filterLevel" onchange="filterCatalogCards()">
                            <option value="all">Todos</option>
                            <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filterSource">Filtrar Fuente:</label>
                        <select id="filterSource" onchange="filterCatalogCards()"><option value="all">Todas</option></select>
                    </div>
                    <div class="filter-group">
                        <label for="searchCard">Buscar:</label>
                        <input type="text" id="searchCard" placeholder="Nombre..." oninput="filterCatalogCards()">
                    </div>
                </div>
            </div>
        </div>

        <div id="builderSection">
            <h3 style="font-family: 'Cinzel', serif; color: var(--border-gold); margin-bottom: 10px;">Selecciona los poderes de tu mazo</h3>
            <div class="builder-list" id="builderListContainer"></div>
        </div>

        <div id="loading">Cargando datos para imprenta...</div>
        <div id="cardsContainer" class="cards-grid"></div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQaQJuLj6_QRdKghfXWQFV5NThMJF-tXWJDIRJiwShVfbusDaCsQbHL-ZFHL-NaB4DF9MCllinL6RfA/pub?gid=0&single=true&output=csv';
        let allDisciplinesData = [];
        let currentMode = 'catalog';
        let selectedCharacterPowers = new Set();
        let manuallySelectedCards = new Set(); // Almacena objetos de filas seleccionadas individualmente

        const ICONOS_MAP = {
            'animalismo': 'Animalism_symbol.png', 'auspex': 'Auspex_symbol.png', 'celeridad': 'Celerity_symbol.png',
            'dominación': 'Dominate_symbol.png', 'fortaleza': 'Fortitude_symbol.png', 'hechicería de sangre': 'Blood_Sorcery_symbol.png',
            'ofuscación': 'Obfuscate_symbol.png', 'olvido': 'Oblivion_symbol.png', 'potencia': 'Potence_symbol.png',
            'presencia': 'Presence_symbol.png', 'protean': 'Protean_symbol.png', 'alquimia de sangre débil': 'Alchemy_symbol.png'
        };

        const LOGO_ROJO_FILENAME = 'VTM-Logo-Largo.png';

        window.onload = function() {
            Papa.parse(CSV_URL, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    allDisciplinesData = results.data.filter(row => (row['Nombre Poder'] || row['Nombre']));
                    document.getElementById('loading').style.display = 'none';
                    populateFilters(allDisciplinesData);
                    populateBuilderList(allDisciplinesData);
                    filterCatalogCards();
                }
            });
        };

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('catalogSection').style.display = mode === 'catalog' ? 'block' : 'none';
            document.getElementById('builderSection').style.display = mode === 'builder' ? 'block' : 'none';
            document.getElementById('tabCatalog').classList.toggle('active', mode === 'catalog');
            document.getElementById('tabBuilder').classList.toggle('active', mode === 'builder');
            renderActiveMode();
        }

        function populateFilters(data) {
            const disciplinesSet = new Set(), sourcesSet = new Set();
            data.forEach(row => {
                if (row['Disciplina']) disciplinesSet.add(row['Disciplina'].trim());
                if (row['Fuente_Libro'] || row['Fuente']) sourcesSet.add((row['Fuente_Libro'] || row['Fuente']).trim());
            });
            const selDisc = document.getElementById('filterDiscipline');
            disciplinesSet.forEach(d => selDisc.innerHTML += `<option value="${d.toLowerCase()}">${d}</option>`);
            const selSrc = document.getElementById('filterSource');
            sourcesSet.forEach(s => selSrc.innerHTML += `<option value="${s.toLowerCase()}">${s}</option>`);
        }

        function populateBuilderList(data) {
            const container = document.getElementById('builderListContainer');
            container.innerHTML = '';
            data.forEach((row, idx) => {
                const name = row['Nombre Poder'] || row['Nombre'];
                container.innerHTML += `
                    <label class="builder-item">
                        <div><input type="checkbox" value="${name}" onchange="togglePower('${name}', this.checked)"> <strong>${name}</strong> (${row['Disciplina'] || 'General'})</div>
                    </label>`;
            });
        }

        function togglePower(name, isChecked) {
            if (isChecked) selectedCharacterPowers.add(name); else selectedCharacterPowers.delete(name);
            if (currentMode === 'builder') renderActiveMode();
        }

        function renderActiveMode() {
            if (currentMode === 'catalog') filterCatalogCards();
            else renderSelectedBuilderCards();
        }

        function createCardElement(row) {
            const name = row['Nombre Poder'] || row['Nombre'] || '';
            const disc = row['Disciplina'] || 'General';
            const level = row['Nivel'] || '1';
            const discKey = disc.toLowerCase().trim();
            const icon = ICONOS_MAP[discKey] ? `<img src="./iconos/${ICONOS_MAP[discKey]}" class="discipline-watermark-img">` : '';
            const levelImg = `<img src="./iconos/${level}_symbol.png" class="card-level-img" onerror="this.style.display='none'">`;
            const cornerIcon = ICONOS_MAP[discKey] ? `<img src="./iconos/${ICONOS_MAP[discKey]}" class="card-discipline-icon-img">` : '';

            const isManualChecked = Array.from(manuallySelectedCards).some(r => (r['Nombre Poder'] || r['Nombre']) === name);

            const wrapper = document.createElement('div');
            wrapper.className = `print-card-wrapper ${isManualChecked ? 'selected' : ''}`;
            
            wrapper.innerHTML = `
                <input type="checkbox" class="card-select-checkbox" ${isManualChecked ? 'checked' : ''} title="Seleccionar para imprimir solo esta" onchange="toggleManualSelection(event, ${JSON.stringify(name).replace(/"/g, '&quot;')})">
                <div class="vtm-card">
                    ${icon}
                    <div class="card-main-content">
                        <div class="card-header"><span>${disc}</span></div>
                        <div class="card-title">${name}</div>
                        <div class="card-roll-box">${row['Tirada'] || row['Reserva de Dados'] || 'Sin tirada'}</div>
                        <div class="card-body">${row['Descripción'] || ''}</div>
                        <div class="card-costs"><span>Coste: ${row['Coste'] || '-'}</span><span>Duración: ${row['Duración'] || '-'}</span></div>
                    </div>
                    <div class="card-footer-container">
                        <div class="card-footer-layout">
                            <div>${levelImg}</div>
                            <div class="card-source-text">${row['Fuente_Libro'] || row['Fuente'] || 'V5'}</div>
                            <div>${cornerIcon}</div>
                        </div>
                    </div>
                </div>`;
            return wrapper;
        }

        function toggleManualSelection(event, cardName) {
            const isChecked = event.target.checked;
            const rowData = allDisciplinesData.find(r => (r['Nombre Poder'] || r['Nombre']) === cardName);
            
            if (rowData) {
                if (isChecked) {
                    manuallySelectedCards.add(rowData);
                    event.target.closest('.print-card-wrapper').classList.add('selected');
                } else {
                    manuallySelectedCards.forEach(r => {
                        if ((r['Nombre Poder'] || r['Nombre']) === cardName) manuallySelectedCards.delete(r);
                    });
                    event.target.closest('.print-card-wrapper').classList.remove('selected');
                }
            }
            updateSelectionStatus();
        }

        function clearManualSelection() {
            manuallySelectedCards.clear();
            document.querySelectorAll('.card-select-checkbox').forEach(cb => cb.checked = false);
            document.querySelectorAll('.print-card-wrapper').forEach(w => w.classList.remove('selected'));
            updateSelectionStatus();
        }

        function updateSelectionStatus() {
            const statusEl = document.getElementById('selectionStatus');
            if (manuallySelectedCards.size > 0) {
                statusEl.textContent = `🎯 ${manuallySelectedCards.size} carta(s) seleccionada(s) manualmente para imprimir.`;
                statusEl.style.color = '#ff6b6b';
            } else {
                statusEl.textContent = `Mostrando todas las cartas visibles (Ninguna seleccionada individualmente)`;
                statusEl.style.color = 'var(--border-gold)';
            }
        }

        function filterCatalogCards() {
            if (currentMode !== 'catalog') return;
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            
            const sDisc = document.getElementById('filterDiscipline').value;
            const sLvl = document.getElementById('filterLevel').value;
            const sSrc = document.getElementById('filterSource').value;
            const sQuery = document.getElementById('searchCard').value.toLowerCase();

            allDisciplinesData.filter(row => {
                const d = (row['Disciplina'] || '').toLowerCase();
                const l = (row['Nivel'] || '1').trim();
                const src = (row['Fuente_Libro'] || row['Fuente'] || '').toLowerCase();
                const n = (row['Nombre Poder'] || row['Nombre'] || '').toLowerCase();
                return (sDisc === 'all' || d.includes(sDisc)) && (sLvl === 'all' || l === sLvl) && (sSrc === 'all' || src.includes(sSrc)) && (!sQuery || n.includes(sQuery));
            }).forEach(row => container.appendChild(createCardElement(row)));
        }

        function renderSelectedBuilderCards() {
            if (currentMode !== 'builder') return;
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            allDisciplinesData.filter(row => selectedCharacterPowers.has(row['Nombre Poder'] || row['Nombre'])).forEach(row => container.appendChild(createCardElement(row)));
        }

        function obtenerCartasActivas() {
            // Prioridad 1: Si el usuario ha marcado cartas individualmente, imprimimos SOLO esas.
            if (manuallySelectedCards.size > 0) {
                return Array.from(manuallySelectedCards);
            }

            // Prioridad 2: Si está en modo Mazo Personalizado
            if (currentMode === 'builder') {
                return allDisciplinesData.filter(row => selectedCharacterPowers.has(row['Nombre Poder'] || row['Nombre']));
            } 
            
            // Prioridad 3: Catálogo General con filtros aplicados
            const sDisc = document.getElementById('filterDiscipline').value;
            const sLvl = document.getElementById('filterLevel').value;
            const sSrc = document.getElementById('filterSource').value;
            const sQuery = document.getElementById('searchCard').value.toLowerCase();
            return allDisciplinesData.filter(row => {
                const d = (row['Disciplina'] || '').toLowerCase();
                const l = (row['Nivel'] || '1').trim();
                const src = (row['Fuente_Libro'] || row['Fuente'] || '').toLowerCase();
                const n = (row['Nombre Poder'] || row['Nombre'] || '').toLowerCase();
                return (sDisc === 'all' || d.includes(sDisc)) && (sLvl === 'all' || l === sLvl) && (sSrc === 'all' || src.includes(sSrc)) && (!sQuery || n.includes(sQuery));
            });
        }

        function imprimirSimplex() {
            const cartas = obtenerCartasActivas();
            if (!cartas.length) return alert("No hay cartas seleccionadas.");
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            cartas.forEach(row => container.appendChild(createCardElement(row)));
            setTimeout(() => window.print(), 300);
        }

        function imprimirDuplex() {
            const cartas = obtenerCartasActivas();
            if (!cartas.length) return alert("No hay cartas seleccionadas.");
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            
            cartas.forEach(row => container.appendChild(createCardElement(row)));

            const pb = document.createElement('div');
            pb.className = 'page-break';
            container.appendChild(pb);

            const total = Math.ceil(cartas.length / 9) * 9;
            for (let i = 0; i < total; i++) {
                const wrap = document.createElement('div');
                wrap.className = 'print-card-wrapper';
                wrap.innerHTML = `
                    <div class="vtm-card-back">
                        <img src="./iconos/${LOGO_ROJO_FILENAME}" class="back-top-logo" alt="Logo" onerror="this.src='./iconos/VTM-Logo-Largo.png'">
                        <img src="./iconos/VTM-Ank.png" class="back-center-ank" alt="Ankh" onerror="this.style.display='none'">
                    </div>`;
                container.appendChild(wrap);
            }
            setTimeout(() => window.print(), 300);
        }
    </script>
</body>
</html>

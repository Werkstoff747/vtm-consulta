<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Edición Imprenta - Disciplinas V5</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --card-width: 63mm;
            --card-height: 88mm;
            --bleed: 3mm;
            --full-w: 69mm;
            --full-h: 94mm;
        }

        body { background: #333; margin: 0; padding: 10mm; display: flex; flex-wrap: wrap; justify-content: center; }

        .print-card-wrapper {
            width: var(--full-w);
            height: var(--full-h);
            background: black;
            position: relative;
            outline: 0.1mm solid #555; /* Guía de corte */
        }

        .vtm-card {
            width: var(--card-width);
            height: var(--card-height);
            position: absolute;
            top: var(--bleed);
            left: var(--bleed);
            background: #000;
            color: #ddd;
            padding: 3mm;
            display: flex;
            flex-direction: column;
            border: 1px solid #333;
        }

        .card-title { color: #c5a059; font-weight: bold; text-align: center; margin-bottom: 2mm; }
        .card-body { font-size: 0.7rem; text-align: justify; }

        @media print {
            body { background: white; padding: 0; }
            .print-card-wrapper { outline: none; }
        }
    </style>
</head>
<body>

    <div id="printArea" style="display: grid; grid-template-columns: repeat(3, var(--full-w));"></div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQaQJuLj6_QRdKghfXWQFV5NThMJF-tXWJDIRJiwShVfbusDaCsQbHL-ZFHL-NaB4DF9MCllinL6RfA/pub?gid=0&single=true&output=csv';

        Papa.parse(CSV_URL, {
            download: true, header: true, complete: function(results) {
                const container = document.getElementById('printArea');
                results.data.forEach(row => {
                    if (!(row['Nombre Poder'] || row['Nombre'])) return;
                    
                    const wrapper = document.createElement('div');
                    wrapper.className = 'print-card-wrapper';
                    
                    const card = document.createElement('div');
                    card.className = 'vtm-card';
                    card.innerHTML = `
                        <div class="card-title">${row['Nombre Poder'] || row['Nombre']}</div>
                        <div class="card-body">${row['Descripción'] || ''}</div>
                    `;
                    
                    wrapper.appendChild(card);
                    container.appendChild(wrapper);
                });
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compendio de Disciplinas V5 - Impresión Profesional</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./iconos/drRol.png">
    <!-- Fuentes oficiales V5 -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <!-- PapaParse para leer el CSV de tu Google Sheet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        /* =========================================================
            VARIABLES DE TEMA Y MEDIDAS DE IMPRESIÓN PROFESIONAL (OSCURO)
            Corte exterior final (Línea gris): 63 x 88 mm
            Sangrado hacia dentro: 1.5 mm por cada lado
            Cuadro rojo interior de la carta: 60 x 85 mm
           ========================================================= */
        :root {
            --bg-color: #0f0f12;
            --card-bg: #18181c;
            --card-border: #2a2a32;
            --accent-red: #8b0000;
            --accent-crimson: #c92a2a;
            --accent-gold: #c5a059;
            --text-main: #e1e1e6;
            --text-muted: #a0a0b0;
            --tag-bg: #25252e;
            --input-bg: #121215;
            --header-bg: linear-gradient(180deg, rgba(139,0,0,0.3) 0%, rgba(15,15,18,0) 100%);
            --header-border: #8b0000;
            --logo-filter: drop-shadow(0px 2px 8px rgba(201, 42, 42, 0.4));
            
            --full-width: 63mm;
            --full-height: 88mm;
            --bleed: 1.5mm;
            --card-width: 60mm;
            --card-height: 85mm;
            
            --wrapper-bg: #000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact !important; 
            print-color-adjust: exact !important;
        }

        body {
            font-family: 'EB Garamond', serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* CABECERA */
        header {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 20px 20px 20px;
            border-bottom: 2px solid var(--header-border);
            margin-bottom: 25px;
            background: var(--header-bg);
            border-radius: 8px;
            text-align: center;
        }

        .header-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 12px;
            max-width: 100%;
        }

        .header-ank-logo {
            height: 55px;
            width: auto;
            object-fit: contain;
            filter: var(--logo-filter);
        }

        .header-main-logo {
            height: 95px;
            max-width: 85vw;
            width: auto;
            object-fit: contain;
            filter: var(--logo-filter);
        }

        h1.cabecera-principal {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.35rem;
            color: var(--accent-gold);
            font-variant: small-caps;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            line-height: 1.15;
        }

        /* PANEL DE CONTROL Y PESTAÑAS DE MODO */
        .no-print-controls {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .mode-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
            flex-wrap: wrap;
        }

        .tab-btn {
            font-family: 'Cinzel', serif;
            padding: 8px 16px;
            background: var(--tag-bg);
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .tab-btn.active {
            background: var(--accent-red);
            color: white;
            border-color: var(--accent-gold);
        }

        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        button, select, input {
            font-family: 'Cinzel', serif;
            padding: 8px 14px;
            background: var(--accent-red);
            color: white;
            border: 1px solid var(--accent-gold);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        button:hover, select:hover {
            background: var(--accent-crimson);
        }

        .btn-secondary {
            background: var(--accent-gold);
            color: #111115;
            font-weight: 600;
        }

        .filters-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .filter-group label {
            display: block;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            margin-bottom: 5px;
            color: var(--accent-gold);
            font-weight: 600;
        }

        .filter-group select, .filter-group input {
            width: 100%;
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 8px;
            font-family: inherit;
        }

        /* CUADRÍCULA ESTRICTA DE CARTAS (Exactamente 189mm de ancho = 3 columnas de 63mm) */
        .cards-grid {
            width: 189mm;
            max-width: 189mm;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, var(--full-width));
            gap: 0;
            justify-content: center;
        }

        .print-card-wrapper {
            width: var(--full-width);
            height: var(--full-height);
            background: var(--wrapper-bg) !important;
            position: relative;
            border: 0.3mm solid #888;
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .vtm-card {
            width: var(--card-width);
            height: var(--card-height);
            position: absolute;
            top: var(--bleed);
            left: var(--bleed);
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 3px solid var(--accent-red);
            padding: 2.5mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .vtm-card-back {
            width: var(--card-width);
            height: var(--card-height);
            position: absolute;
            top: var(--bleed);
            left: var(--bleed);
            background-color: var(--card-bg);
            border: 3px solid var(--accent-red);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .vtm-card-back::after, .vtm-card::after {
            content: "";
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 2px;
            border: 1px solid var(--accent-gold);
            pointer-events: none;
        }

        .back-top-logo {
            width: 42mm;
            height: auto;
            object-fit: contain;
            position: absolute;
            top: 7mm;
            left: 50%;
            transform: translateX(-50%);
        }

        .back-center-ank {
            width: 24mm;
            height: 24mm;
            object-fit: contain;
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .discipline-watermark-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 28mm;
            height: 28mm;
            object-fit: contain;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
            user-select: none;
        }

        .card-main-content {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            position: relative;
            z-index: 1;
        }

        .card-header {
            background: transparent !important;
            color: var(--accent-red) !important;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--accent-red);
            margin-bottom: 1mm;
            padding-bottom: 0.6mm;
        }

        .card-discipline {
            font-family: 'Cinzel', serif;
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-red);
            font-weight: 700;
            line-height: 1;
        }

        .card-titles-container {
            text-align: center;
            margin-bottom: 0.8mm;
            border-bottom: 1px solid var(--accent-gold);
            padding-bottom: 1px;
        }

        .card-title {
            font-family: 'Cinzel', serif;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.1;
            text-transform: small-caps;
        }

        .card-roll-box {
            font-size: 0.55rem;
            background: rgba(197, 160, 89, 0.08);
            border: 1px solid rgba(197, 160, 89, 0.3);
            padding: 2.5px 3.5px;
            border-radius: 3px;
            margin-bottom: 0.8mm;
            text-align: center;
            line-height: 1.1;
        }

        .card-roll-line-1 {
            font-weight: bold;
            color: var(--accent-crimson);
            font-size: 0.58rem;
        }

        .card-roll-line-2 {
            font-style: italic;
            color: var(--text-muted);
            font-size: 0.45rem;
            margin: 1px 0;
        }

        .card-roll-line-3 {
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.55rem;
        }

        .card-body {
            font-size: 0.58rem;
            line-height: 1.15;
            overflow-y: hidden;
            padding: 1px 2px;
            text-align: justify;
        }

        .card-costs {
            font-size: 0.5rem;
            background: rgba(197, 160, 89, 0.12);
            border: 1px solid var(--accent-gold);
            padding: 2px 3.5px;
            border-radius: 3px;
            margin-top: auto;
            margin-bottom: 0.8mm;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }

        .card-costs span span {
            color: var(--accent-gold);
            font-weight: bold;
        }

        .card-footer-container {
            border-top: 1px solid var(--accent-gold);
            padding-top: 0.6mm;
            margin-top: 0;
            position: relative;
            z-index: 1;
        }

        .card-footer-layout {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-level-img {
            width: 5mm;
            height: 5mm;
            object-fit: contain;
        }

        .card-source-text {
            font-size: 0.4rem;
            color: var(--text-muted);
            font-family: 'Cinzel', serif;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .card-discipline-icon-img {
            width: 5mm;
            height: 5mm;
            object-fit: contain;
            opacity: 1;
        }

        /* BOTÓN FLOTANTE */
        .floating-nav-container {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 999;
        }

        .floating-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--accent-red);
            border: 1px solid var(--accent-crimson);
            color: #ffffff;
            font-size: 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .floating-btn:hover {
            background-color: var(--accent-crimson);
            border-color: var(--accent-gold);
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(139, 0, 0, 0.6);
        }

        #loading {
            text-align: center;
            font-size: 1.1rem;
            color: var(--accent-gold);
            padding: 40px;
            font-family: 'Cinzel', serif;
        }

        .page-break {
            display: block;
            clear: both;
            height: 0;
            width: 100%;
            grid-column: span 3;
            margin: 0;
            border: none;
        }

        @media print {
            body {
                background: var(--wrapper-bg) !important;
                color: black !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 210mm;
                height: 297mm;
            }

            .no-print-controls, header, .floating-nav-container {
                display: none !important;
            }

            @page {
                size: A4 portrait;
                margin: 0mm;
            }

            .cards-grid {
                display: grid !important;
                grid-template-columns: repeat(3, var(--full-width)) !important;
                width: 189mm !important;
                margin: 0 auto !important;
                justify-content: center !important;
                align-content: center !important;
                gap: 0 !important;
            }

            .print-card-wrapper {
                width: var(--full-width) !important;
                height: var(--full-height) !important;
                border: 0.3mm solid #888 !important;
                box-sizing: border-box !important;
                background: #000 !important;
            }

            .page-break {
                display: block !important;
                page-break-after: always;
                break-after: page;
                height: 0;
                width: 100%;
                grid-column: span 3;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabecera -->
        <header>
            <div class="header-logos">
                <img src="./iconos/VTM-Ank.png" class="header-ank-logo" alt="Ankh VTM" onerror="this.onerror=null; this.src='iconos/VTM-Ank.png';">
                <img src="./iconos/VTM-Logo-Largo.png" class="header-main-logo" alt="Vampiro La Mascarada" onerror="this.onerror=null; this.src='iconos/VTM-Logo-Largo.png';">
            </div>
            <div class="header-text">
                <h1 class="cabecera-principal">Compendio de Cartas Imprimibles - Profesional</h1>
            </div>
        </header>

        <!-- Panel de Control y Opciones -->
        <div class="no-print-controls">
            <div class="controls-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                <div class="mode-tabs">
                    <a href="cartas.html" class="tab-btn">📚 Volver a Cartas (Claro)</a>
                </div>
                
                <!-- SELECTOR DE ESTILO DE IMPRESIÓN -->
                <div style="display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.2); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent-gold);">
                    <label for="printStyleSelect" style="font-family: 'Cinzel', serif; font-size: 0.8rem; color: var(--accent-gold); white-space: nowrap; margin-bottom: 0;">Estilo Impresión:</label>
                    <select id="printStyleSelect" onchange="togglePrintStyle(this.value)" style="padding: 6px 10px; background: var(--input-bg); color: var(--text-main); border: 1px solid var(--accent-gold); border-radius: 4px; cursor: pointer;">
                        <option value="professional" selected>Profesional (Oscuro)</option>
                        <option value="printfriendly">Print-Friendly (Claro / Ahorro de Tinta)</option>
                    </select>
                </div>
            </div>

            <!-- Botones de Impresión Dúplex y Simplex -->
            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--card-border); display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap;">
                <button class="btn-secondary" onclick="imprimirSimplex()">🖨️ IMPRIMIR ANVERSOS (SIMPLEX)</button>
                <button class="btn-secondary" onclick="imprimirDuplex()">🖨️ IMPRIMIR DÚPLEX (ANVERSO/REVERSO)</button>
            </div>

            <!-- Filtros -->
            <div style="margin-top: 15px;">
                <div class="filters-row">
                    <div class="filter-group">
                        <label for="filterDiscipline">Filtrar Disciplina:</label>
                        <select id="filterDiscipline" onchange="filterCatalogCards()">
                            <option value="all">Todas las Disciplinas</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filterLevel">Filtrar Nivel:</label>
                        <select id="filterLevel" onchange="filterCatalogCards()">
                            <option value="all">Todos los Niveles</option>
                            <option value="1">Nivel 1</option>
                            <option value="2">Nivel 2</option>
                            <option value="3">Nivel 3</option>
                            <option value="4">Nivel 4</option>
                            <option value="5">Nivel 5</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filterSource">Filtrar Fuente:</label>
                        <select id="filterSource" onchange="filterCatalogCards()">
                            <option value="all">Todas las Fuentes</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="searchCard">Buscar Poder:</label>
                        <input type="text" id="searchCard" placeholder="Nombre o palabra clave..." oninput="filterCatalogCards()">
                    </div>
                </div>
            </div>
        </div>

        <div id="loading">Cargando cartas desde Google Sheets...</div>

        <!-- Contenedor donde se generan las cartas dinámicamente -->
        <div id="cardsContainer" class="cards-grid"></div>
    </div>

    <!-- Botón flotante -->
    <div class="floating-nav-container">
        <a href="index.html" class="floating-btn" title="Volver al Compendio Principal">◀</a>
        <button class="floating-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'});" title="Subir Arriba">▲</button>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQaQJuLj6_QRdKghfXWQFV5NThMJF-tXWJDIRJiwShVfbusDaCsQbHL-ZFHL-NaB4DF9MCllinL6RfA/pub?gid=0&single=true&output=csv';
        let allDisciplinesData = [];

        const ICONOS_MAP = {
            'animalismo': 'Animalism_symbol.png', 'auspex': 'Auspex_symbol.png', 'celeridad': 'Celerity_symbol.png',
            'dominación': 'Dominate_symbol.png', 'fortaleza': 'Fortitude_symbol.png', 'hechicería de sangre': 'Blood_Sorcery_symbol.png',
            'ofuscación': 'Obfuscate_symbol.png', 'olvido': 'Oblivion_symbol.png', 'potencia': 'Potence_symbol.png',
            'presencia': 'Presence_symbol.png', 'protean': 'Protean_symbol.png', 'alquimia de sangre débil': 'Alchemy_symbol.png'
        };

        const LOGO_ROJO_FILENAME = 'VTM-Logo-Largo.png'; 

        function togglePrintStyle(style) {
            if (style === 'printfriendly') {
                window.location.href = 'cartas.html';
            }
        }

        window.onload = function() {
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    allDisciplinesData = results.data.filter(row => {
                        const nombre = (row['Nombre Poder'] || row['Nombre'] || '').trim();
                        return nombre && nombre.toLowerCase() !== 'nombre poder';
                    });

                    document.getElementById('loading').style.display = 'none';

                    allDisciplinesData.sort((a, b) => {
                        let lvlA = parseInt(a['Nivel'] || 1, 10);
                        let lvlB = parseInt(b['Nivel'] || 1, 10);
                        if (lvlA !== lvlB) return lvlA - lvlB;
                        return (a['Nombre Poder'] || '').localeCompare(b['Nombre Poder']);
                    });

                    populateFilters(allDisciplinesData);
                    filterCatalogCards();
                },
                error: function(err) {
                    console.error("Error al cargar Google Sheets:", err);
                    document.getElementById('loading').textContent = "Error al cargar los datos del compendio.";
                }
            });
        };

        function populateFilters(data) {
            const disciplinesSet = new Set();
            const sourcesSet = new Set();

            data.forEach(row => {
                const disc = row['Disciplina'] || row['DISCIPLINA'];
                if (disc) disciplinesSet.add(disc.trim());

                const source = row['Fuente_Libro'] || row['Fuente'];
                if (source && source.trim() !== '-') sourcesSet.add(source.trim());
            });

            const selectDisc = document.getElementById('filterDiscipline');
            Array.from(disciplinesSet).sort().forEach(disc => {
                const opt = document.createElement('option');
                opt.value = disc.toLowerCase();
                opt.textContent = disc;
                selectDisc.appendChild(opt);
            });

            const selectSource = document.getElementById('filterSource');
            Array.from(sourcesSet).sort().forEach(src => {
                const opt = document.createElement('option');
                opt.value = src.toLowerCase();
                opt.textContent = src;
                selectSource.appendChild(opt);
            });
        }

        function createCardElement(row) {
            const name = row['Nombre Poder'] || row['Nombre'] || 'Sin Nombre';
            const discipline = row['Disciplina'] || 'General';
            let level = (row['Nivel'] || '1').trim();
            
            if (!['1', '2', '3', '4', '5'].includes(level)) {
                level = '1';
            }
            
            const pool = (row['Reserva de Dados'] || row['Reserva de dados'] || row['Tirada'] || '').trim();
            const opposition = (row['Reserva Oposición'] || row['Reserva Oposicion'] || row['Reserva oposicion'] || '').trim();
            
            const cost = row['Controles de Ansia'] || row['Coste'] || 'Ninguno';
            const duration = row['Duracion'] || row['Duración'] || 'Escena';
            const desc = row['Descripción'] || row['DESCRIPCION'] || 'Sin descripción disponible.';
            
            const sourceBook = row['Fuente_Libro'] || row['Fuente'] || 'V5';
            const sourcePage = row['Fuente_Pag'] || row['Página'] || '';

            const discKey = discipline.toLowerCase().trim();
            const archivoIcono = ICONOS_MAP[discKey];
            let watermarkHTML = '';
            let cornerIconHTML = '';
            if (archivoIcono) {
                watermarkHTML = `<img src="./iconos/${archivoIcono}" class="discipline-watermark-img" alt="" onerror="this.style.display='none'">`;
                cornerIconHTML = `<img src="./iconos/${archivoIcono}" class="card-discipline-icon-img" alt="${discipline}" onerror="this.style.display='none'">`;
            }

            const levelImgHTML = `<img src="./iconos/${level}_symbol.png" class="card-level-img" alt="Nivel ${level}" onerror="this.style.display='none'">`;

            let rollBoxHTML = '';
            const oppositionLower = opposition.toLowerCase();
            const isSinOposicion = !opposition || opposition === '-' || oppositionLower === 'sin oposición' || oppositionLower === 'sin oposicion';

            if (pool && pool !== '-') {
                if (isSinOposicion) {
                    rollBoxHTML = `
                        <div class="card-roll-box">
                            <div class="card-roll-line-1">${pool}</div>
                        </div>
                    `;
                } else {
                    rollBoxHTML = `
                        <div class="card-roll-box">
                            <div class="card-roll-line-1">${pool}</div>
                            <div class="card-roll-line-2">vs.</div>
                            <div class="card-roll-line-3">${opposition}</div>
                        </div>
                    `;
                }
            } else {
                rollBoxHTML = `
                    <div class="card-roll-box">
                        <div class="card-roll-line-1">Sin tirada</div>
                    </div>
                `;
            }

            let sourceDisplay = sourceBook;
            if (sourcePage && sourcePage.trim() !== '-' && sourcePage.trim() !== '') {
                sourceDisplay += ` (pág. ${sourcePage})`;
            }

            const wrapper = document.createElement('div');
            wrapper.className = 'print-card-wrapper';

            wrapper.innerHTML = `
                <div class="vtm-card">
                    ${watermarkHTML}
                    <div class="card-main-content">
                        <div class="card-header">
                            <span class="card-discipline">${discipline}</span>
                        </div>
                        <div class="card-titles-container">
                            <div class="card-title">${name}</div>
                        </div>
                        ${rollBoxHTML}
                        <div class="card-body">
                            ${desc}
                        </div>
                        <div class="card-costs">
                            <span>Coste: <span>${cost}</span></span>
                            <span>Duración: <span>${duration}</span></span>
                        </div>
                    </div>
                    <div class="card-footer-container">
                        <div class="card-footer-layout">
                            <div>${levelImgHTML}</div>
                            <div class="card-source-text">${sourceDisplay}</div>
                            <div>${cornerIconHTML}</div>
                        </div>
                    </div>
                </div>
            `;
            return wrapper;
        }

        function filterCatalogCards() {
            const selectedDisc = document.getElementById('filterDiscipline').value;
            const selectedLevel = document.getElementById('filterLevel').value;
            const selectedSource = document.getElementById('filterSource').value;
            const searchQuery = document.getElementById('searchCard').value.toLowerCase();

            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            const filteredData = allDisciplinesData.filter(row => {
                const discipline = (row['Disciplina'] || 'General').toLowerCase().trim();
                let level = (row['Nivel'] || '1').trim();
                const source = (row['Fuente_Libro'] || row['Fuente'] || 'V5').toLowerCase().trim();
                const name = (row['Nombre Poder'] || row['Nombre'] || '').toLowerCase();
                const fullText = Object.values(row).join(' ').toLowerCase();

                const matchesDisc = (selectedDisc === 'all' || discipline.includes(selectedDisc));
                const matchesLevel = (selectedLevel === 'all' || level === selectedLevel);
                const matchesSource = (selectedSource === 'all' || source.includes(selectedSource));
                const matchesSearch = (!searchQuery || name.includes(searchQuery) || fullText.includes(searchQuery));

                return matchesDisc && matchesLevel && matchesSource && matchesSearch;
            });

            filteredData.forEach(row => {
                container.appendChild(createCardElement(row));
            });
        }

        function obtenerCartasActivas() {
            const selectedDisc = document.getElementById('filterDiscipline').value;
            const selectedLevel = document.getElementById('filterLevel').value;
            const selectedSource = document.getElementById('filterSource').value;
            const searchQuery = document.getElementById('searchCard').value.toLowerCase();

            return allDisciplinesData.filter(row => {
                const discipline = (row['Disciplina'] || 'General').toLowerCase().trim();
                let level = (row['Nivel'] || '1').trim();
                const source = (row['Fuente_Libro'] || row['Fuente'] || 'V5').toLowerCase().trim();
                const name = (row['Nombre Poder'] || row['Nombre'] || '').toLowerCase();
                const fullText = Object.values(row).join(' ').toLowerCase();

                const matchesDisc = (selectedDisc === 'all' || discipline.includes(selectedDisc));
                const matchesLevel = (selectedLevel === 'all' || level === selectedLevel);
                const matchesSource = (selectedSource === 'all' || source.includes(selectedSource));
                const matchesSearch = (!searchQuery || name.includes(searchQuery) || fullText.includes(searchQuery));

                return matchesDisc && matchesLevel && matchesSource && matchesSearch;
            });
        }

        /* IMPRESIÓN SIMPLEX */
        function imprimirSimplex() {
            const cartas = obtenerCartasActivas();
            if (cartas.length === 0) {
                alert("No hay cartas visibles para imprimir.");
                return;
            }

            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            cartas.forEach(row => container.appendChild(createCardElement(row)));

            setTimeout(() => { window.print(); }, 300);
        }

        /* IMPRESIÓN DÚPLEX (BLOQUES DE 9) */
        function imprimirDuplex() {
            const cartas = obtenerCartasActivas();
            if (cartas.length === 0) {
                alert("No hay cartas visibles para imprimir.");
                return;
            }

            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            const chunkSize = 9;
            const totalPaginas = Math.ceil(cartas.length / chunkSize);

            for (let p = 0; p < totalPaginas; p++) {
                const inicio = p * chunkSize;
                const fin = Math.min(inicio + chunkSize, cartas.length);
                const chunk = cartas.slice(inicio, fin);

                chunk.forEach(row => {
                    container.appendChild(createCardElement(row));
                });

                const resto = chunkSize - chunk.length;
                if (resto > 0) {
                    for (let r = 0; r < resto; r++) {
                        const emptyWrapper = document.createElement('div');
                        emptyWrapper.className = 'print-card-wrapper';
                        emptyWrapper.style.visibility = 'hidden';
                        container.appendChild(emptyWrapper);
                    }
                }

                const break1 = document.createElement('div');
                break1.className = 'page-break';
                container.appendChild(break1);

                for (let j = 0; j < chunkSize; j++) {
                    const wrapBack = document.createElement('div');
                    wrapBack.className = 'print-card-wrapper';
                    wrapBack.innerHTML = `
                        <div class="vtm-card-back">
                            <img src="./iconos/${LOGO_ROJO_FILENAME}" class="back-top-logo" alt="Logo" onerror="this.src='./iconos/VTM-Logo-Largo.png'">
                            <img src="./iconos/VTM-Ank.png" class="back-center-ank" alt="Ankh" onerror="this.style.display='none'">
                        </div>
                    `;
                    container.appendChild(wrapBack);
                }

                if (p < totalPaginas - 1) {
                    const break2 = document.createElement('div');
                    break2.className = 'page-break';
                    container.appendChild(break2);
                }
            }

            setTimeout(() => { window.print(); }, 300);
        }
    </script>

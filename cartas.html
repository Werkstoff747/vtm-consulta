<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compendio de Disciplinas V5 - Cartas Imprimibles</title>
    <!-- PapaParse para la carga de datos desde Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

        :root {
            --bg-color: #e3e0d8;
            --card-bg: #f5f2eb;
            --text-main: #1a1a1a;
            --accent-blood: #5c101c;
            --accent-gold: #b38f58;
            --card-border: #8c857b;
            --card-width: 63mm;
            --card-height: 88mm; /* Tamaño estándar de carta de juego (Bridge/Poker) */
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --accent-blood: #8a1c2d;
            --accent-gold: #c5a059;
            --card-border: #444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'EB Garamond', serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }

        /* Controles de la interfaz (pantalla) */
        .no-print-controls {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--accent-blood);
            font-size: 1.8rem;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button, select, input {
            font-family: 'Cinzel', serif;
            padding: 8px 14px;
            background: var(--accent-blood);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        button:hover, select:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: var(--accent-gold);
            color: #1a1a1a;
            font-weight: 600;
        }

        .filters-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .filter-group label {
            display: block;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: var(--accent-gold);
        }

        .filter-group select, .filter-group input {
            width: 100%;
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--card-border);
        }

        /* Contenedor de Cuadrícula para Pantalla */
        .cards-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--card-width), 1fr));
            gap: 20px;
            justify-content: center;
        }

        /* Estilo de la Carta (Física y Digital) */
        .vtm-card {
            width: var(--card-width);
            height: var(--card-height);
            background-color: var(--card-bg);
            border: 2px solid var(--accent-blood);
            border-radius: 6px;
            padding: 6mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .vtm-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: var(--accent-blood);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid var(--accent-gold);
            padding-bottom: 3px;
            margin-bottom: 4px;
        }

        .card-title {
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-blood);
            line-height: 1.1;
        }

        .card-level {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--accent-blood);
            color: white;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .card-meta {
            font-size: 0.65rem;
            color: #666;
            margin-bottom: 4px;
            font-style: italic;
            display: flex;
            justify-content: space-between;
        }

        body.dark-mode .card-meta {
            color: #aaa;
        }

        .card-body {
            font-size: 0.7rem;
            line-height: 1.25;
            overflow-y: hidden;
            flex-grow: 1;
            margin-bottom: 4px;
        }

        .card-footer {
            border-top: 1px dashed var(--card-border);
            padding-top: 3px;
            font-size: 0.6rem;
            display: flex;
            justify-content: space-between;
            color: var(--accent-gold);
            font-family: 'Cinzel', serif;
        }

        /* Estilos de Impresión Profesional (A4 / Carta con marcas de corte) */
        @media print {
            body {
                background: white !important;
                color: black !important;
                padding: 0 !important;
            }

            .no-print-controls {
                display: none !important;
            }

            .cards-grid {
                display: block;
                max-width: none;
                margin: 0;
            }

            .vtm-card {
                margin: 0;
                float: left;
                border: 1px solid #333 !important;
                box-shadow: none !important;
                background-color: #fff !important;
                color: #000 !important;
                page-break-inside: avoid;
                break-inside: avoid;
            }

            @page {
                size: A4;
                margin: 10mm;
            }
        }
    </style>
</head>
<body>

    <!-- Panel de control interactivo (oculto al imprimir) -->
    <div class="no-print-controls">
        <div class="controls-header">
            <h1>🎴 Generador de Cartas Imprimibles - V5</h1>
            <div class="btn-group">
                <button onclick="toggleDarkMode()">🌓 Modo Noche / Día</button>
                <button class="btn-secondary" onclick="window.print()">🖨️ Imprimir Cartas</button>
            </div>
        </div>

        <div class="filter-row">
            <div class="filter-group">
                <label for="sheetUrl">Enlace CSV / Google Sheets (Publicado):</label>
                <input type="text" id="sheetUrl" placeholder="Pega tu enlace CSV aquí..." value="">
            </div>
            <div class="filter-group" style="display: flex; align-items: flex-end;">
                <button onclick="loadGoogleSheet()" style="width: 100%;">📥 Cargar Datos</button>
            </div>
        </div>

        <div class="filters-row">
            <div class="filter-group">
                <label for="filterDiscipline">Filtrar Disciplina:</label>
                <select id="filterDiscipline" onchange="filterCards()">
                    <option value="all">Todas las Disciplinas</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterLevel">Filtrar Nivel:</label>
                <select id="filterLevel" onchange="filterCards()">
                    <option value="all">Todos los Niveles</option>
                    <option value="1">Nivel 1</option>
                    <option value="2">Nivel 2</option>
                    <option value="3">Nivel 3</option>
                    <option value="4">Nivel 4</option>
                    <option value="5">Nivel 5</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="searchCard">Buscar Poder:</label>
                <input type="text" id="searchCard" placeholder="Nombre o palabra clave..." oninput="filterCards()">
            </div>
        </div>
    </div>

    <!-- Contenedor donde se generan dinámicamente las cartas -->
    <div id="cardsContainer" class="cards-grid">
        <!-- Tarjeta de ejemplo por defecto si no hay CSV cargado -->
        <div class="vtm-card" data-discipline="Celeridad" data-level="1" data-name="borrón y cuenta nueva">
            <div class="card-header">
                <span class="card-title">Borrón y Cuenta Nueva</span>
                <span class="card-level">1</span>
            </div>
            <div class="card-meta">
                <span>Celeridad</span>
                <span>Guía de Juego</span>
            </div>
            <div class="card-body">
                <b>Reserva:</b> Destreza + Atletismo<br>
                <b>Coste:</b> Gratuito<br>
                <b>Efecto:</b> El vampiro se mueve con velocidad sobrenatural, permitiéndole esquivar ataques con bonificador adicional.
            </div>
            <div class="card-footer">
                <span>V5 MDT</span>
                <span>Poder</span>
            </div>
        </div>
    </div>

    <script>
        let allDisciplinesData = [];

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        // Carga de datos mediante PapaParse (compatible con tu Google Sheets del compendio)
        function loadGoogleSheet() {
            const url = document.getElementById('sheetUrl').value.trim();
            if (!url) {
                alert("Por favor, introduce una URL válida de CSV o Google Sheets publicado.");
                return;
            }

            Papa.parse(url, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    allDisciplinesData = results.data;
                    populateFilters(allDisciplinesData);
                    renderCards(allDisciplinesData);
                },
                error: function(err) {
                    alert("Error al cargar el archivo CSV: " + err.message);
                }
            });
        }

        function populateFilters(data) {
            const disciplinesSet = new Set();
            data.forEach(row => {
                const disc = row.Disciplina || row.discipline || row.Clase;
                if (disc) disciplinesSet.add(disc.trim());
            });

            const selectDisc = document.getElementById('filterDiscipline');
            selectDisc.innerHTML = '<option value="all">Todas las Disciplinas</option>';
            disciplinesSet.forEach(disc => {
                const opt = document.createElement('option');
                opt.value = disc.toLowerCase();
                opt.textContent = disc;
                selectDisc.appendChild(opt);
            });
        }

        function renderCards(data) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            data.forEach(row => {
                const name = row.Nombre || row.name || 'Sin Nombre';
                const discipline = row.Disciplina || row.discipline || 'General';
                const level = row.Nivel || row.level || '1';
                const pool = row.Reserva || row.pool || 'Especial';
                const cost = row.Coste || row.cost || 'Ninguno';
                const desc = row.Sistema || row.Description || row.descripcion || 'Sin descripción disponible.';
                const source = row.Fuente || row.source || 'V5';

                const card = document.createElement('div');
                card.className = 'vtm-card';
                card.setAttribute('data-discipline', discipline.toLowerCase());
                card.setAttribute('data-level', level);
                card.setAttribute('data-name', name.toLowerCase());

                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">${name}</span>
                        <span class="card-level">${level}</span>
                    </div>
                    <div class="card-meta">
                        <span>${discipline}</span>
                        <span>${source}</span>
                    </div>
                    <div class="card-body">
                        <b>Reserva:</b> ${pool}<br>
                        <b>Coste:</b> ${cost}<br>
                        ${desc}
                    </div>
                    <div class="card-footer">
                        <span>V5 MDT</span>
                        <span>Poder</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterCards() {
            const selectedDisc = document.getElementById('filterDiscipline').value;
            const selectedLevel = document.getElementById('filterLevel').value;
            const searchQuery = document.getElementById('searchCard').value.toLowerCase();

            const cards = document.querySelectorAll('.vtm-card');
            cards.forEach(card => {
                const disc = card.getAttribute('data-discipline');
                const level = card.getAttribute('data-level');
                const name = card.getAttribute('data-name');
                const text = card.textContent.toLowerCase();

                const matchesDisc = (selectedDisc === 'all' || disc.includes(selectedDisc));
                const matchesLevel = (selectedLevel === 'all' || level.trim() === selectedLevel);
                const matchesSearch = (!searchQuery || name.includes(searchQuery) || text.includes(searchQuery));

                if (matchesDisc && matchesLevel && matchesSearch) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>

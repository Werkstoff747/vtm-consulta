<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Cartas Imprimibles V5</title>
    <!-- PapaParse para leer tu Google Sheet dinámicamente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @page {
            size: A4;
            margin: 10mm;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f0;
            color: #111115;
            margin: 0;
            padding: 20px;
        }

        .no-print {
            text-align: center;
            margin-bottom: 20px;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .no-print button {
            background-color: #5c101c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .no-print button:hover {
            background-color: #8b0000;
        }

        /* Contenedor de la página A4 (exactamente 3x3 cartas) */
        .a4-page {
            width: 210mm;
            height: 297mm;
            background: #ffffff;
            margin: 0 auto 10mm auto;
            padding: 10mm;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(3, 63.5mm);
            grid-template-rows: repeat(3, 88.9mm);
            gap: 4mm;
            justify-content: center;
            align-content: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
            page-break-after: always;
        }

        /* Estilo individual de la carta (Tamaño Póker estándar: 63.5mm x 88.9mm) */
        .carta {
            width: 63.5mm;
            height: 88.9mm;
            border: 2mm solid #5c101c; /* Borde granate oficial V5 */
            border-radius: 4px;
            padding: 3mm;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Contenido de la carta */
        .contenido-carta {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }

        .card-header {
            border-bottom: 1.5px solid #8b0000;
            padding-bottom: 1.5mm;
            margin-bottom: 1.5mm;
            text-align: center;
        }

        /* Nombre de la disciplina más grande y con un rojo vivo/intenso */
        .card-discipline {
            font-family: 'Cinzel', serif;
            font-size: 8.5pt;
            color: #b30000;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 0.5mm;
        }

        .card-title {
            font-weight: 700;
            font-size: 9pt;
            font-variant: small-caps;
            color: #111115;
            margin: 0;
            line-height: 1.1;
        }

        /* Reserva de dados vs oposición más grande y destacada */
        .card-meta {
            font-size: 7.5pt;
            color: #111115;
            background-color: rgba(139, 0, 0, 0.05);
            border-left: 2px solid #8b0000;
            padding: 1.5mm 2mm;
            margin-bottom: 2mm;
            font-weight: bold;
        }

        /* Descripción ampliada para aprovechar mejor el espacio de la carta */
        .card-desc {
            font-size: 6.5pt;
            line-height: 1.25;
            color: #222222;
            overflow: hidden;
            flex-grow: 1;
            text-align: justify;
        }

        /* Bloque inferior: Coste y Duración */
        .card-middle-footer {
            font-size: 6pt;
            color: #333333;
            margin-top: 1mm;
            padding-top: 1mm;
            border-top: 1px dotted #cccccc;
            display: flex;
            flex-direction: column;
            gap: 0.5mm;
        }

        /* Pie de carta definitivo: esquinas y fuente/página */
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 1.5mm;
            position: relative;
            height: 8mm;
        }

        /* Esquina inferior izquierda: Rombo rojo con nivel en blanco negrita */
        .level-diamond {
            width: 6mm;
            height: 6mm;
            background-color: #8b0000;
            transform: rotate(45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 1mm;
            margin-bottom: 1mm;
        }

        .level-diamond span {
            transform: rotate(-45deg);
            color: #ffffff;
            font-size: 7pt;
            font-weight: bold;
        }

        /* Esquina inferior derecha: Icono de disciplina sin opacidad (opacidad 1) */
        .corner-icon {
            width: 7mm;
            height: 7mm;
            object-fit: contain;
            opacity: 1; /* Sin opacidad tal como pediste */
        }

        /* Cita de fuente y página en el pie de página */
        .card-source-info {
            position: absolute;
            bottom: 0;
            left: 8mm;
            right: 8mm;
            text-align: center;
            font-size: 5pt;
            font-weight: bold;
            color: #555555;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Ocultar controles y sombras al imprimir en papel */
        @media print {
            body {
                background: none;
                padding: 0;
            }
            .no-print {
                display: none;
            }
            .a4-page {
                margin: 0;
                box-shadow: none;
                page-break-after: always;
            }
        }
    </style>
</head>
<body>

    <div class="no-print">
        <h1>🖨️ Generador de Cartas Imprimibles V5</h1>
        <p>Cargando poderes desde tu Google Sheets... Organizado automáticamente en páginas A4 de 9 cartas (3x3).</p>
        <button onclick="window.print()">Imprimir Páginas A4</button>
    </div>

    <!-- Contenedor donde se inyectarán las páginas A4 con las cartas -->
    <div id="printContainer"></div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQaQJuLj6_QRdKghfXWQFV5NThMJF-tXWJDIRJiwShVfbusDaCsQbHL-ZFHL-NaB4DF9MCllinL6RfA/pub?gid=0&single=true&output=csv';

        // Mapeo exacto de los nombres de disciplinas a tus archivos en /iconos/
        const ICONOS_MAP = {
            'Animalismo': 'Animalism_symbol.png',
            'Auspex': 'Auspex_symbol.png',
            'Celeridad': 'Celerity_symbol.png',
            'Dominación': 'Dominate_symbol.png',
            'Fortaleza': 'Fortitude_symbol.png',
            'Hechicería de Sangre': 'Blood_Sorcery_symbol.png',
            'Ofuscación': 'Obfuscate_symbol.png',
            'Olvido': 'Oblivion_symbol.png',
            'Potencia': 'Potence_symbol.png',
            'Presencia': 'Presence_symbol.png',
            'Protean': 'Protean_symbol.png',
            'Alquimia de Sangre Débil': 'Alchemy_symbol.png'
        };

        Papa.parse(CSV_URL, {
            download: true,
            header: false,
            skipEmptyLines: true,
            complete: function(results) {
                const filas = results.data;
                
                // Procesar filas de la hoja según el orden de columnas del proyecto
                const datos = filas.slice(1).map(row => {
                    return {
                        nombre: (row[0] || '').trim(),
                        disciplina: (row[2] || '').trim(),
                        nivel: (row[3] || '').trim(),
                        coste: (row[7] || '').trim(),
                        reservaDados: (row[8] || '').trim(),
                        reservaOposicion: (row[9] || '').trim(),
                        duracion: (row[10] || '').trim(),
                        descripcion: (row[12] || '').trim(),
                        fuenteLibro: (row[14] || '').trim(),
                        fuentePag: (row[15] || '').trim()
                    };
                }).filter(item => item.nombre && item.nombre.toLowerCase() !== 'nombre poder');

                const container = document.getElementById('printContainer');
                container.innerHTML = '';

                let currentPage = null;
                let cardsOnCurrentPage = 0;

                datos.forEach((item) => {
                    if (cardsOnCurrentPage === 0) {
                        currentPage = document.createElement('div');
                        currentPage.className = 'a4-page';
                        container.appendChild(currentPage);
                    }

                    const archivoIcono = ICONOS_MAP[item.disciplina] || 'VTM-Ank.png';
                    
                    // Formatear reserva de dados vs oposición
                    let textoReserva = '';
                    if (item.reservaDados && item.reservaDados !== '-') {
                        textoReserva = `🎲 ${item.reservaDados}`;
                        if (item.reservaOposicion && item.reservaOposicion !== '-' && item.reservaOposicion.toLowerCase() !== 'sin oposición') {
                            textoReserva += ` <em>vs</em> ${item.reservaOposicion}`;
                        }
                    }

                    // Formatear fuente y página
                    let fuenteInfo = item.fuenteLibro || 'V5';
                    if (item.fuentePag && item.fuentePag !== '-') {
                        fuenteInfo += ` (pág. ${item.fuentePag})`;
                    }

                    const cartaEl = document.createElement('div');
                    cartaEl.className = 'carta';
                    cartaEl.innerHTML = `
                        <div class="contenido-carta">
                            <div>
                                <div class="card-header">
                                    <span class="card-discipline">${item.disciplina}</span>
                                    <h2 class="card-title">${item.nombre}</h2>
                                </div>
                                ${textoReserva ? `<div class="card-meta">${textoReserva}</div>` : ''}
                                <div class="card-desc">${item.descripcion}</div>
                            </div>
                            
                            <div>
                                <div class="card-middle-footer">
                                    <span><strong>Coste:</strong> ${item.coste && item.coste !== '-' ? item.coste : 'Ninguno'}</span>
                                    <span><strong>Duración:</strong> ${item.duracion && item.duracion !== '-' ? item.duracion : 'Especial'}</span>
                                </div>
                                <div class="card-footer">
                                    <div class="level-diamond"><span>${item.nivel || '-'}</span></div>
                                    <div class="card-source-info">${fuenteInfo}</div>
                                    <img src="./iconos/${archivoIcono}" class="corner-icon" alt="Icono" onerror="this.style.display='none'">
                                </div>
                            </div>
                        </div>
                    `;

                    currentPage.appendChild(cartaEl);
                    cardsOnCurrentPage++;

                    if (cardsOnCurrentPage === 9) {
                        cardsOnCurrentPage = 0;
                    }
                });
            }
        });
    </script>
</body>
</html>

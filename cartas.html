<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compendio de Disciplinas V5 - Cartas Imprimibles</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./iconos/drRol.png">
    <!-- Fuentes oficiales V5 -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <!-- PapaParse para leer el CSV de tu Google Sheet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        /* =========================================================
            VARIABLES DE TEMA (VAMPIRO: LA MASCARADA V5)
           ========================================================= */
        :root {
            --bg-color: #0f0f12;
            --card-bg: #18181c;
            --card-border: #2a2a32;
            --accent-red: #8b0000;
            --accent-crimson: #c92a2a;
            --accent-gold: #c5a059;
            --text-main: #e1e1e6;
            --text-muted: #a0a0b0;
            --tag-bg: #25252e;
            --input-bg: #0f0f12;
            --header-bg: linear-gradient(180deg, rgba(139,0,0,0.3) 0%, rgba(15,15,18,0) 100%);
            --header-border: #8b0000;
            --logo-filter: drop-shadow(0px 2px 8px rgba(201, 42, 42, 0.4));
            --card-width: 63mm;
            --card-height: 88mm;
        }

        body.light-mode {
            --bg-color: #a8a7a4;
            --card-bg: #ffffff;
            --card-border: #bcaba0;
            --accent-red: #8b0000;
            --accent-crimson: #c92a2a;
            --accent-gold: #8d6722;
            --text-main: #1f1f22;
            --text-muted: #555459;
            --tag-bg: #f2f0eb;
            --input-bg: #ffffff;
            --header-bg: #2b0408;
            --header-border: #7a0000;
            --logo-filter: drop-shadow(0px 2px 8px rgba(201, 42, 42, 0.5));
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'EB Garamond', serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* CABECERA */
        header {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 20px 20px 20px;
            border-bottom: 2px solid var(--header-border);
            margin-bottom: 25px;
            background: var(--header-bg);
            border-radius: 8px;
            text-align: center;
        }

        .header-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 12px;
            max-width: 100%;
        }

        .header-ank-logo {
            height: 55px;
            width: auto;
            object-fit: contain;
            filter: var(--logo-filter);
        }

        .header-main-logo {
            height: 95px;
            max-width: 85vw;
            width: auto;
            object-fit: contain;
            filter: var(--logo-filter);
        }

        h1.cabecera-principal {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.35rem;
            color: var(--accent-gold);
            font-variant: small-caps;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            line-height: 1.15;
        }

        .theme-btn-header {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .theme-btn-header:hover {
            background-color: var(--accent-red);
            color: #ffffff;
            border-color: var(--accent-crimson);
            transform: scale(1.08);
        }

        /* PANEL DE CONTROL Y PESTAÑAS DE MODO */
        .no-print-controls {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .mode-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 15px;
            flex-wrap: wrap;
        }

        .tab-btn {
            font-family: 'Cinzel', serif;
            padding: 8px 16px;
            background: var(--tag-bg);
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .tab-btn.active {
            background: var(--accent-red);
            color: white;
            border-color: var(--accent-gold);
        }

        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button, select, input {
            font-family: 'Cinzel', serif;
            padding: 8px 14px;
            background: var(--accent-red);
            color: white;
            border: 1px solid var(--accent-gold);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        button:hover, select:hover {
            background: var(--accent-crimson);
        }

        .btn-secondary {
            background: var(--accent-gold);
            color: #111115;
            font-weight: 600;
        }

        .filters-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .filter-group label {
            display: block;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            margin-bottom: 5px;
            color: var(--accent-gold);
            font-weight: 600;
        }

        .filter-group select, .filter-group input {
            width: 100%;
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 8px;
            font-family: inherit;
        }

        /* CONTENEDOR MODO PERSONAJE */
        #builderSection {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .builder-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .builder-filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.15);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
        }

        .builder-list {
            max-height: 380px;
            overflow-y: auto;
            border: 1px solid var(--card-border);
            padding: 10px;
            border-radius: 6px;
            background: var(--input-bg);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .builder-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .builder-item:hover {
            background: rgba(197, 160, 89, 0.08);
            border-color: rgba(197, 160, 89, 0.3);
        }

        .builder-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .builder-item input[type="checkbox"] {
            cursor: pointer;
            accent-color: var(--accent-red);
            width: 18px;
            height: 18px;
        }

        .builder-badge-disc {
            font-size: 0.75rem;
            background: var(--accent-red);
            color: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Cinzel', serif;
        }

        /* CUADRÍCULA ESTRICTA DE CARTAS (3x3 con gap: 0) */
        .cards-grid {
            max-width: 189mm;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, var(--card-width));
            gap: 0;
            justify-content: center;
        }

        /* CARTA FÍSICA V5 */
        .vtm-card {
            width: var(--card-width);
            min-width: var(--card-width);
            max-width: var(--card-width);
            height: var(--card-height);
            min-height: var(--card-height);
            max-height: var(--card-height);
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 4px solid var(--accent-red);
            padding: 3.5mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            page-break-inside: avoid;
            break-inside: avoid;
        }

        /* TRASERA GENÉRICA (Logo superior ocupando máximo ancho + Ank centrado, sin sombras) */
        .vtm-card-back {
            width: var(--card-width);
            min-width: var(--card-width);
            max-width: var(--card-width);
            height: var(--card-height);
            min-height: var(--card-height);
            max-height: var(--card-height);
            background-color: white;
            border: 4px solid var(--accent-red);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .vtm-card-back::after {
            content: "";
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 2px;
            border: 1px solid var(--accent-gold);
            pointer-events: none;
        }

        .back-top-logo {
            width: 52mm; /* Máximo ancho posible dentro de los márgenes de la carta */
            height: auto;
            object-fit: contain;
            position: absolute;
            top: 10mm;
            left: 50%;
            transform: translateX(-50%);
        }

        .back-center-ank {
            width: 32mm; /* Ank perfectamente centrado */
            height: 32mm;
            object-fit: contain;
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .vtm-card::after {
            content: "";
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 2px;
            border: 1px solid var(--accent-gold);
            pointer-events: none;
        }

        .discipline-watermark-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 35mm;
            height: 35mm;
            object-fit: contain;
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
            user-select: none;
        }

        .card-main-content {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            position: relative;
            z-index: 1;
        }

        .card-header {
            background: var(--accent-red);
            color: white;
            height: 5.5mm;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            margin-bottom: 2mm;
        }

        .card-discipline {
            font-family: 'Cinzel', serif;
            font-size: 0.54rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-gold);
            font-weight: 600;
            line-height: 1;
        }

        .card-titles-container {
            text-align: center;
            margin-bottom: 2mm;
            border-bottom: 1px solid var(--accent-gold);
            padding-bottom: 2px;
        }

        .card-title {
            font-family: 'Cinzel', serif;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.15;
            text-transform: small-caps;
        }

        .card-roll-box {
            font-size: 0.56rem;
            background: rgba(197, 160, 89, 0.08);
            border: 1px solid rgba(197, 160, 89, 0.3);
            padding: 3px 6px;
            border-radius: 3px;
            margin-bottom: 2mm;
            text-align: center;
            line-height: 1.2;
        }

        .card-roll-line-1 {
            font-weight: bold;
            color: var(--accent-crimson);
        }

        .card-roll-line-2 {
            font-style: italic;
            color: var(--text-muted);
            font-size: 0.5rem;
            margin: 1px 0;
        }

        .card-roll-line-3 {
            font-weight: 600;
            color: var(--text-main);
        }

        .card-body {
            font-size: 0.62rem;
            line-height: 1.25;
            overflow-y: hidden;
            padding: 1px 2px;
            text-align: justify;
        }

        .card-costs {
            font-size: 0.55rem;
            background: rgba(197, 160, 89, 0.12);
            border: 1px solid var(--accent-gold);
            padding: 3px 5px;
            border-radius: 3px;
            margin-top: auto;
            margin-bottom: 1.5mm;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }

        .card-costs span span {
            color: var(--accent-gold);
            font-weight: bold;
        }

        .card-footer-container {
            border-top: 1px solid var(--accent-gold);
            padding-top: 1.5mm;
            margin-top: 0;
            position: relative;
            z-index: 1;
        }

        .card-footer-layout {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-level-img {
            width: 6.5mm;
            height: 6.5mm;
            object-fit: contain;
        }

        .card-source-text {
            font-size: 0.44rem;
            color: var(--text-muted);
            font-family: 'Cinzel', serif;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .card-discipline-icon-img {
            width: 6.5mm;
            height: 6.5mm;
            object-fit: contain;
            opacity: 1;
        }

        #loading {
            text-align: center;
            font-size: 1.1rem;
            color: var(--accent-gold);
            padding: 40px;
            font-family: 'Cinzel', serif;
        }

        /* Estilos de Impresión A4 compactos */
        @media print {
            body {
                background: white !important;
                color: black !important;
                padding: 0 !important;
            }

            .no-print-controls, header, #builderSection {
                display: none !important;
            }

            .cards-grid {
                display: grid !important;
                grid-template-columns: repeat(3, var(--card-width)) !important;
                justify-content: center !important;
                align-content: start !important;
                gap: 0 !important;
                max-width: none !important;
                margin: 0 auto !important;
            }

            .vtm-card, .vtm-card-back {
                margin: 0 !important;
                float: none !important;
                box-shadow: none !important;
                background-color: #fff !important;
                border: 2px solid #333 !important;
                page-break-inside: avoid;
                break-inside: avoid;
                color: #111115 !important;
            }

            .vtm-card .card-title {
                color: #5c101c !important;
            }

            .vtm-card .card-source-text {
                color: #444 !important;
            }

            @page {
                size: A4;
                margin: 10mm;
            }
        }
    </style>
</head>
<body class="light-mode">

    <div class="container">
        <!-- Cabecera -->
        <header>
            <button id="themeToggleBtn" class="theme-btn-header" onclick="toggleTheme()" title="Cambiar Tema Día/Noche">🌙</button>
            <div class="header-logos">
                <img src="./iconos/VTM-Ank.png" class="header-ank-logo" alt="Ankh VTM" onerror="this.onerror=null; this.src='iconos/VTM-Ank.png';">
                <img src="./iconos/VTM-Logo-Largo.png" class="header-main-logo" alt="Vampiro La Mascarada" onerror="this.onerror=null; this.src='iconos/VTM-Logo-Largo.png';">
            </div>
            <div class="header-text">
                <h1 class="cabecera-principal">Compendio de Cartas Imprimibles V5</h1>
            </div>
        </header>

        <!-- Selector de Modo / Pestañas -->
        <div class="no-print-controls">
            <div class="mode-tabs">
                <button class="tab-btn active" id="tabCatalog" onclick="switchMode('catalog')">📚 Catálogo General (Filtros)</button>
                <button class="tab-btn" id="tabBuilder" onclick="switchMode('builder')">🧙‍♂️ Mazo Personalizado de Personaje</button>
                <button class="tab-btn btn-secondary" id="tabBacks" onclick="switchMode('backs')" style="margin-left: auto;">🎴 Generar Trasera Genérica</button>
            </div>

            <!-- BOTÓN EXCLUSIVO DE IMPRESIÓN DE TRASERAS -->
            <div id="printBacksContainer" style="display: none; margin-bottom: 15px; text-align: right;">
                <button class="btn-secondary" onclick="window.print()">🖨️ Imprimir Traseras de Cartas</button>
            </div>

            <!-- MODO CATÁLOGO GENERAL -->
            <div id="catalogSection">
                <div class="controls-header">
                    <div style="font-family: 'Cinzel', serif; color: var(--accent-gold); font-weight: 700;">🎴 Generador por Filtros</div>
                    <div class="btn-group">
                        <a href="index.html" style="text-decoration: none;"><button type="button">⬅️ Volver al Compendio</button></a>
                        <button class="btn-secondary" onclick="window.print()">🖨️ Imprimir Cartas (A4)</button>
                    </div>
                </div>

                <div class="filters-row">
                    <div class="filter-group">
                        <label for="filterDiscipline">Filtrar Disciplina:</label>
                        <select id="filterDiscipline" onchange="filterCatalogCards()">
                            <option value="all">Todas las Disciplinas</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filterLevel">Filtrar Nivel:</label>
                        <select id="filterLevel" onchange="filterCatalogCards()">
                            <option value="all">Todos los Niveles</option>
                            <option value="1">Nivel 1</option>
                            <option value="2">Nivel 2</option>
                            <option value="3">Nivel 3</option>
                            <option value="4">Nivel 4</option>
                            <option value="5">Nivel 5</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="searchCard">Buscar Poder:</label>
                        <input type="text" id="searchCard" placeholder="Nombre o palabra clave..." oninput="filterCatalogCards()">
                    </div>
                </div>
            </div>
        </div>

        <!-- MODO MAZO DE PERSONAJE -->
        <div id="builderSection">
            <div class="builder-top-bar">
                <div>
                    <h3 style="font-family: 'Cinzel', serif; color: var(--accent-gold);">Arma el mazo de tu personaje</h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted);">Filtra por disciplina o nivel para encontrar los poderes rápidamente y marcarlos.</p>
                </div>
                <div class="btn-group">
                    <button type="button" onclick="selectAllBuilder(true)">Seleccionar Visibles</button>
                    <button type="button" onclick="selectAllBuilder(false)" class="tab-btn" style="color:white;">Deseleccionar Visibles</button>
                    <button class="btn-secondary" id="btnPrintBuilder" onclick="window.print()">🖨️ Imprimir Mazo (0)</button>
                </div>
            </div>

            <!-- Filtros específicos para el selector de mazo -->
            <div class="builder-filters">
                <div class="filter-group">
                    <label for="builderFilterDisc">Filtrar Disciplina:</label>
                    <select id="builderFilterDisc" onchange="filterBuilderList()">
                        <option value="all">Todas las Disciplinas</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="builderFilterLvl">Filtrar Nivel:</label>
                    <select id="builderFilterLvl" onchange="filterBuilderList()">
                        <option value="all">Todos los Niveles</option>
                        <option value="1">Nivel 1</option>
                        <option value="2">Nivel 2</option>
                        <option value="3">Nivel 3</option>
                        <option value="4">Nivel 4</option>
                        <option value="5">Nivel 5</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="builderSearch">Buscar en Mazo:</label>
                    <input type="text" id="builderSearch" placeholder="Nombre del poder..." oninput="filterBuilderList()">
                </div>
            </div>

            <div class="builder-list" id="builderListContainer">
                <!-- Se rellena dinámicamente -->
            </div>
        </div>

        <div id="loading">Cargando cartas desde Google Sheets...</div>

        <!-- Contenedor donde se generan las cartas dinámicamente -->
        <div id="cardsContainer" class="cards-grid"></div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQaQJuLj6_QRdKghfXWQFV5NThMJF-tXWJDIRJiwShVfbusDaCsQbHL-ZFHL-NaB4DF9MCllinL6RfA/pub?gid=0&single=true&output=csv';
        let allDisciplinesData = [];
        let currentMode = 'catalog'; // 'catalog', 'builder', 'backs'
        let selectedCharacterPowers = new Set();

        const ICONOS_MAP = {
            'animalismo': 'Animalism_symbol.png',
            'auspex': 'Auspex_symbol.png',
            'celeridad': 'Celerity_symbol.png',
            'dominación': 'Dominate_symbol.png',
            'fortaleza': 'Fortitude_symbol.png',
            'hechicería de sangre': 'Blood_Sorcery_symbol.png',
            'ofuscación': 'Obfuscate_symbol.png',
            'olvido': 'Oblivion_symbol.png',
            'potencia': 'Potence_symbol.png',
            'presencia': 'Presence_symbol.png',
            'protean': 'Protean_symbol.png',
            'alquimia de sangre débil': 'Alchemy_symbol.png'
        };

        // Cambia esto si tu archivo de logo rojo tiene otro nombre en /iconos/
        const LOGO_ROJO_FILENAME = 'VTM-Logo-Largo.png'; 

        function initTheme() {
            const savedTheme = localStorage.getItem('vtm-theme');
            const themeBtn = document.getElementById('themeToggleBtn');
            if (savedTheme === 'dark') {
                document.body.classList.remove('light-mode');
                if (themeBtn) themeBtn.textContent = '🌙';
            } else {
                document.body.classList.add('light-mode');
                if (themeBtn) themeBtn.textContent = '☀️';
            }
        }

        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('themeToggleBtn');
            body.classList.toggle('light-mode');

            if (body.classList.contains('light-mode')) {
                themeBtn.textContent = '☀️';
                localStorage.setItem('vtm-theme', 'light');
            } else {
                themeBtn.textContent = '🌙';
                localStorage.setItem('vtm-theme', 'dark');
            }
        }

        window.onload = function() {
            initTheme();

            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    allDisciplinesData = results.data.filter(row => {
                        const nombre = (row['Nombre Poder'] || row['Nombre'] || '').trim();
                        return nombre && nombre.toLowerCase() !== 'nombre poder';
                    });

                    document.getElementById('loading').style.display = 'none';

                    allDisciplinesData.sort((a, b) => {
                        let lvlA = parseInt(a['Nivel'] || 1, 10);
                        let lvlB = parseInt(b['Nivel'] || 1, 10);
                        if (lvlA !== lvlB) return lvlA - lvlB;
                        return (a['Nombre Poder'] || '').localeCompare(b['Nombre Poder']);
                    });

                    populateFilters(allDisciplinesData);
                    populateBuilderList(allDisciplinesData);
                    renderActiveMode();
                    updateBuilderButtonCount();
                },
                error: function(err) {
                    console.error("Error al cargar Google Sheets:", err);
                    document.getElementById('loading').textContent = "Error al cargar los datos del compendio.";
                }
            });
        };

        function switchMode(mode) {
            currentMode = mode;
            const catalogSec = document.getElementById('catalogSection');
            const builderSec = document.getElementById('builderSection');
            const printBacksSec = document.getElementById('printBacksContainer');
            const tabCat = document.getElementById('tabCatalog');
            const tabBld = document.getElementById('tabBuilder');
            const tabBck = document.getElementById('tabBacks');

            tabCat.classList.remove('active');
            tabBld.classList.remove('active');
            tabBck.classList.remove('active');

            if (mode === 'catalog') {
                catalogSec.style.display = 'block';
                builderSec.style.display = 'none';
                printBacksSec.style.display = 'none';
                tabCat.classList.add('active');
            } else if (mode === 'builder') {
                catalogSec.style.display = 'none';
                builderSec.style.display = 'block';
                printBacksSec.style.display = 'none';
                tabBld.classList.add('active');
            } else if (mode === 'backs') {
                catalogSec.style.display = 'none';
                builderSec.style.display = 'none';
                printBacksSec.style.display = 'block';
                tabBck.classList.add('active');
            }
            renderActiveMode();
        }

        function populateFilters(data) {
            const disciplinesSet = new Set();
            data.forEach(row => {
                const disc = row['Disciplina'] || row['DISCIPLINA'];
                if (disc) disciplinesSet.add(disc.trim());
            });

            const selectDisc = document.getElementById('filterDiscipline');
            const builderDisc = document.getElementById('builderFilterDisc');
            
            Array.from(disciplinesSet).sort().forEach(disc => {
                const opt1 = document.createElement('option');
                opt1.value = disc.toLowerCase();
                opt1.textContent = disc;
                selectDisc.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = disc.toLowerCase();
                opt2.textContent = disc;
                builderDisc.appendChild(opt2);
            });
        }

        function populateBuilderList(data) {
            const container = document.getElementById('builderListContainer');
            container.innerHTML = '';

            data.forEach((row, index) => {
                const name = row['Nombre Poder'] || row['Nombre'] || 'Sin Nombre';
                const discipline = row['Disciplina'] || 'General';
                const level = (row['Nivel'] || '1').trim();
                const uniqueId = `power_${index}`;
                const isChecked = selectedCharacterPowers.has(name) ? 'checked' : '';

                const item = document.createElement('div');
                item.className = 'builder-row-item';
                item.setAttribute('data-disc', discipline.toLowerCase());
                item.setAttribute('data-level', level);
                item.setAttribute('data-name', name.toLowerCase());

                item.innerHTML = `
                    <label class="builder-item" for="${uniqueId}" style="width: 100%; margin: 0;">
                        <div class="builder-item-left">
                            <input type="checkbox" id="${uniqueId}" value="${name}" ${isChecked} onchange="toggleBuilderPower('${name}', this.checked)">
                            <span><strong>${name}</strong></span>
                        </div>
                        <div>
                            <span class="builder-badge-disc">${discipline} (Nivel ${level})</span>
                        </div>
                    </label>
                `;
                container.appendChild(item);
            });
        }

        function filterBuilderList() {
            const discFilter = document.getElementById('builderFilterDisc').value;
            const lvlFilter = document.getElementById('builderFilterLvl').value;
            const searchFilter = document.getElementById('builderSearch').value.toLowerCase().trim();

            const rows = document.querySelectorAll('.builder-row-item');
            rows.forEach(row => {
                const disc = row.getAttribute('data-disc');
                const level = row.getAttribute('data-level');
                const name = row.getAttribute('data-name');

                const matchesDisc = (discFilter === 'all' || disc.includes(discFilter));
                const matchesLvl = (lvlFilter === 'all' || level === lvlFilter);
                const matchesSearch = (!searchFilter || name.includes(searchFilter));

                if (matchesDisc && matchesLvl && matchesSearch) {
                    row.style.display = 'block';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        function toggleBuilderPower(name, isChecked) {
            if (isChecked) {
                selectedCharacterPowers.add(name);
            } else {
                selectedCharacterPowers.delete(name);
            }
            updateBuilderButtonCount();
            if (currentMode === 'builder') {
                renderActiveMode();
            }
        }

        function updateBuilderButtonCount() {
            const count = selectedCharacterPowers.size;
            const btn = document.getElementById('btnPrintBuilder');
            if (btn) {
                btn.textContent = `🖨️ Imprimir Mazo (${count})`;
            }
        }

        function selectAllBuilder(select) {
            const visibleRows = document.querySelectorAll('.builder-row-item');
            visibleRows.forEach(row => {
                if (row.style.display !== 'none') {
                    const cb = row.querySelector('input[type="checkbox"]');
                    if (cb) {
                        cb.checked = select;
                        const name = cb.value;
                        if (select) {
                            selectedCharacterPowers.add(name);
                        } else {
                            selectedCharacterPowers.delete(name);
                        }
                    }
                }
            });
            updateBuilderButtonCount();
            if (currentMode === 'builder') {
                renderActiveMode();
            }
        }

        function renderActiveMode() {
            if (currentMode === 'catalog') {
                filterCatalogCards();
            } else if (currentMode === 'builder') {
                renderSelectedBuilderCards();
            } else if (currentMode === 'backs') {
                renderCardBacks();
            }
        }

        function createCardElement(row) {
            const name = row['Nombre Poder'] || row['Nombre'] || 'Sin Nombre';
            const discipline = row['Disciplina'] || 'General';
            let level = (row['Nivel'] || '1').trim();
            
            if (!['1', '2', '3', '4', '5'].includes(level)) {
                level = '1';
            }
            
            const pool = (row['Reserva de Dados'] || row['Reserva de dados'] || row['Tirada'] || '').trim();
            const opposition = (row['Reserva Oposición'] || row['Reserva Oposicion'] || row['Reserva oposicion'] || '').trim();
            
            const cost = row['Controles de Ansia'] || row['Coste'] || 'Ninguno';
            const duration = row['Duracion'] || row['Duración'] || 'Escena';
            const desc = row['Descripción'] || row['DESCRIPCION'] || 'Sin descripción disponible.';
            
            const sourceBook = row['Fuente_Libro'] || row['Fuente'] || 'V5';
            const sourcePage = row['Fuente_Pag'] || row['Página'] || '';

            const discKey = discipline.toLowerCase().trim();
            const archivoIcono = ICONOS_MAP[discKey];
            let watermarkHTML = '';
            let cornerIconHTML = '';
            if (archivoIcono) {
                watermarkHTML = `<img src="./iconos/${archivoIcono}" class="discipline-watermark-img" alt="" onerror="this.style.display='none'">`;
                cornerIconHTML = `<img src="./iconos/${archivoIcono}" class="discipline-watermark-img" alt="${discipline}" style="position:static; width:6.5mm; height:6.5mm; opacity:1; transform:none;" onerror="this.style.display='none'">`;
            }

            const levelImgHTML = `<img src="./iconos/${level}_symbol.png" class="card-level-img" alt="Nivel ${level}" onerror="this.style.display='none'">`;

            let rollBoxHTML = '';
            const oppositionLower = opposition.toLowerCase();
            const isSinOposicion = !opposition || opposition === '-' || oppositionLower === 'sin oposición' || oppositionLower === 'sin oposicion';

            if (pool && pool !== '-') {
                if (isSinOposicion) {
                    rollBoxHTML = `
                        <div class="card-roll-box">
                            <div class="card-roll-line-1">${pool}</div>
                        </div>
                    `;
                } else {
                    rollBoxHTML = `
                        <div class="card-roll-box">
                            <div class="card-roll-line-1">${pool}</div>
                            <div class="card-roll-line-2">vs.</div>
                            <div class="card-roll-line-3">${opposition}</div>
                        </div>
                    `;
                }
            } else {
                rollBoxHTML = `
                    <div class="card-roll-box">
                        <div class="card-roll-line-1">Sin tirada</div>
                    </div>
                `;
            }

            let sourceDisplay = sourceBook;
            if (sourcePage && sourcePage.trim() !== '-' && sourcePage.trim() !== '') {
                sourceDisplay += ` (pág. ${sourcePage})`;
            }

            const card = document.createElement('div');
            card.className = 'vtm-card';
            card.setAttribute('data-discipline', discKey);
            card.setAttribute('data-level', level);
            card.setAttribute('data-name', name.toLowerCase());

            card.innerHTML = `
                ${watermarkHTML}
                <div class="card-main-content">
                    <div class="card-header">
                        <span class="card-discipline">${discipline}</span>
                    </div>
                    <div class="card-titles-container">
                        <div class="card-title">${name}</div>
                    </div>
                    ${rollBoxHTML}
                    <div class="card-body">
                        ${desc}
                    </div>
                    <div class="card-costs">
                        <span>Coste: <span>${cost}</span></span>
                        <span>Duración: <span>${duration}</span></span>
                    </div>
                </div>
                <div class="card-footer-container">
                    <div class="card-footer-layout">
                        <div>${levelImgHTML}</div>
                        <div class="card-source-text">${sourceDisplay}</div>
                        <div>${cornerIconHTML}</div>
                    </div>
                </div>
            `;
            return card;
        }

        function filterCatalogCards() {
            if (currentMode !== 'catalog') return;

            const selectedDisc = document.getElementById('filterDiscipline').value;
            const selectedLevel = document.getElementById('filterLevel').value;
            const searchQuery = document.getElementById('searchCard').value.toLowerCase();

            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            const filteredData = allDisciplinesData.filter(row => {
                const discipline = (row['Disciplina'] || 'General').toLowerCase().trim();
                let level = (row['Nivel'] || '1').trim();
                const name = (row['Nombre Poder'] || row['Nombre'] || '').toLowerCase();
                const fullText = Object.values(row).join(' ').toLowerCase();

                const matchesDisc = (selectedDisc === 'all' || discipline.includes(selectedDisc));
                const matchesLevel = (selectedLevel === 'all' || level === selectedLevel);
                const matchesSearch = (!searchQuery || name.includes(searchQuery) || fullText.includes(searchQuery));

                return matchesDisc && matchesLevel && matchesSearch;
            });

            filteredData.forEach(row => {
                container.appendChild(createCardElement(row));
            });
        }

        function renderSelectedBuilderCards() {
            if (currentMode !== 'builder') return;

            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            const selectedData = allDisciplinesData.filter(row => {
                const name = row['Nombre Poder'] || row['Nombre'] || '';
                return selectedCharacterPowers.has(name);
            });

            selectedData.forEach(row => {
                container.appendChild(createCardElement(row));
            });
        }

        function renderCardBacks() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            let countToRender = allDisciplinesData.length;
            if (currentMode === 'backs') {
                if (selectedCharacterPowers.size > 0) {
                    countToRender = selectedCharacterPowers.size;
                } else if (document.querySelectorAll('.vtm-card').length > 0) {
                    countToRender = document.querySelectorAll('.vtm-card').length;
                }
            }

            for (let i = 0; i < countToRender; i++) {
                const backCard = document.createElement('div');
                backCard.className = 'vtm-card-back';
                backCard.innerHTML = `
                    <img src="./iconos/${LOGO_ROJO_FILENAME}" class="back-top-logo" alt="Logo" onerror="this.src='./iconos/VTM-Logo-Largo.png'">
                    <img src="./iconos/VTM-Ank.png" class="back-center-ank" alt="Ankh" onerror="this.style.display='none'">
                `;
                container.appendChild(backCard);
            }
        }
    </script>
</body>
</html>

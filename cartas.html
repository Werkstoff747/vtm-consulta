<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compendio de Disciplinas V5 - Cartas Imprimibles</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./iconos/drRol.png">
    <!-- Fuentes oficiales V5 -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <!-- PapaParse para leer el CSV de tu Google Sheet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #e3e0d8;
            --card-bg: #ffffff;
            --text-main: #111115;
            --accent-blood: #5c101c;
            --accent-gold: #c5a059;
            --card-width: 63mm;
            --card-height: 88mm;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'EB Garamond', serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        /* Panel de control superior (Oculto al imprimir) */
        .no-print-controls {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            background: #ffffff;
            color: var(--text-main);
            border: 2px solid var(--accent-blood);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--accent-blood);
            font-size: 1.5rem;
            letter-spacing: 1px;
            font-variant: small-caps;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button, select, input {
            font-family: 'Cinzel', serif;
            padding: 8px 14px;
            background: var(--accent-blood);
            color: white;
            border: 1px solid var(--accent-gold);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        button:hover, select:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: var(--accent-gold);
            color: #111115;
            font-weight: 600;
        }

        .filters-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .filter-group label {
            display: block;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            margin-bottom: 5px;
            color: var(--accent-blood);
            font-weight: 600;
        }

        .filter-group select, .filter-group input {
            width: 100%;
            background: #fff;
            color: #111115;
            border: 1px solid var(--accent-blood);
            padding: 6px;
            font-family: inherit;
        }

        /* Cuadrícula de Cartas para Pantalla */
        .cards-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--card-width), 1fr));
            gap: 20px;
            justify-content: center;
        }

        /* DISEÑO DE CARTA FÍSICA V5 (Tamaño Bridge/Poker 63x88mm) */
        .vtm-card {
            width: var(--card-width);
            height: var(--card-height);
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 3px double var(--accent-blood);
            border-radius: 8px;
            padding: 3.5mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            page-break-inside: avoid;
            break-inside: avoid;
        }

        /* Marco ornamentado interior dorado */
        .vtm-card::after {
            content: "";
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 2px;
            border: 1px solid var(--accent-gold);
            border-radius: 6px;
            pointer-events: none;
        }

        /* Marca de agua translúcida del icono de la disciplina en el fondo */
        .discipline-watermark-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40mm;
            height: 40mm;
            object-fit: contain;
            opacity: 0.07;
            pointer-events: none;
            z-index: 0;
            user-select: none;
        }

        .card-header {
            background: var(--accent-blood);
            color: white;
            padding: 3px 6px;
            border-radius: 3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2mm;
            position: relative;
            z-index: 1;
        }

        .card-discipline {
            font-family: 'Cinzel', serif;
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent-gold);
            font-weight: 700;
        }

        .card-titles-container {
            text-align: center;
            margin-bottom: 2mm;
            position: relative;
            z-index: 1;
            border-bottom: 1px solid var(--accent-gold);
            padding-bottom: 2px;
        }

        .card-title {
            font-family: 'Cinzel', serif;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--accent-blood);
            line-height: 1.1;
        }

        .card-subtitle-en {
            font-size: 0.55rem;
            color: #666666;
            font-style: italic;
            opacity: 0.85;
            margin-top: 1px;
        }

        /* Fila superior para nivel y atributos alineados */
        .card-top-row {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 2mm;
            position: relative;
            z-index: 1;
        }

        .card-level-badge {
            font-family: 'Cinzel', serif;
            font-size: 0.58rem;
            font-weight: 700;
            background: var(--accent-blood);
            color: #ffffff;
            padding: 1.5px 5px;
            border-radius: 3px;
            border: 1px solid #8b0000;
            flex-shrink: 0;
        }

        .card-attributes {
            font-size: 0.52rem;
            background: rgba(197, 160, 89, 0.12);
            border: 1px solid var(--accent-gold);
            padding: 2px 4px;
            border-radius: 3px;
            display: flex;
            gap: 6px;
            flex-grow: 1;
            justify-content: space-around;
        }

        .card-attributes div span {
            font-weight: bold;
            color: var(--accent-blood);
        }

        .card-body {
            font-size: 0.56rem;
            line-height: 1.2;
            overflow-y: hidden;
            flex-grow: 1;
            padding: 1px 2px;
            position: relative;
            z-index: 1;
            text-align: justify;
        }

        .card-footer {
            border-top: 1px solid var(--accent-gold);
            padding-top: 2px;
            font-size: 0.5rem;
            display: flex;
            justify-content: space-between;
            color: #444;
            font-family: 'Cinzel', serif;
            position: relative;
            z-index: 1;
        }

        #loading {
            text-align: center;
            font-size: 1.1rem;
            color: var(--accent-blood);
            padding: 40px;
            font-family: 'Cinzel', serif;
        }

        /* Estilos limpios y profesionales para Impresión A4 */
        @media print {
            body {
                background: white !important;
                color: black !important;
                padding: 0 !important;
            }

            .no-print-controls {
                display: none !important;
            }

            .cards-grid {
                display: block;
                max-width: none;
                margin: 0;
            }

            .vtm-card {
                margin: 0;
                float: left;
                box-shadow: none !important;
                background-color: #fff !important;
                border: 1px solid #222 !important;
                page-break-inside: avoid;
                break-inside: avoid;
            }

            @page {
                size: A4;
                margin: 8mm;
            }
        }
    </style>
</head>
<body>

    <!-- Panel de control de la aplicación (Se oculta al imprimir) -->
    <div class="no-print-controls">
        <div class="controls-header">
            <h1>🎴 Generador de Cartas Imprimibles V5</h1>
            <div class="btn-group">
                <a href="index.html" style="text-decoration: none;"><button type="button">⬅️ Volver al Compendio</button></a>
                <button class="btn-secondary" onclick="window.print()">🖨️ Imprimir Cartas (A4)</button>
            </div>
        </div>

        <div class="filters-row">
            <div class="filter-group">
                <label for="filterDiscipline">Filtrar Disciplina:</label>
                <select id="filterDiscipline" onchange="filterCards()">
                    <option value="all">Todas las Disciplinas</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterLevel">Filtrar Nivel:</label>
                <select id="filterLevel" onchange="filterCards()">
                    <option value="all">Todos los Niveles</option>
                    <option value="1">Nivel 1</option>
                    <option value="2">Nivel 2</option>
                    <option value="3">Nivel 3</option>
                    <option value="4">Nivel 4</option>
                    <option value="5">Nivel 5</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="searchCard">Buscar Poder:</label>
                <input type="text" id="searchCard" placeholder="Nombre o palabra clave..." oninput="filterCards()">
            </div>
        </div>
    </div>

    <div id="loading">Cargando cartas desde Google Sheets...</div>

    <!-- Contenedor donde se generan las cartas dinámicamente -->
    <div id="cardsContainer" class="cards-grid"></div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQaQJuLj6_QRdKghfXWQFV5NThMJF-tXWJDIRJiwShVfbusDaCsQbHL-ZFHL-NaB4DF9MCllinL6RfA/pub?gid=0&single=true&output=csv';
        let allDisciplinesData = [];

        const ICONOS_MAP = {
            'animalismo': 'Animalism_symbol.png',
            'auspex': 'Auspex_symbol.png',
            'celeridad': 'Celerity_symbol.png',
            'dominación': 'Dominate_symbol.png',
            'fortaleza': 'Fortitude_symbol.png',
            'hechicería de sangre': 'Blood_Sorcery_symbol.png',
            'ofuscación': 'Obfuscate_symbol.png',
            'olvido': 'Oblivion_symbol.png',
            'potencia': 'Potence_symbol.png',
            'presencia': 'Presence_symbol.png',
            'protean': 'Protean_symbol.png',
            'alquimia de sangre débil': 'Alchemy_symbol.png'
        };

        window.onload = function() {
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    allDisciplinesData = results.data.filter(row => {
                        const nombre = (row['Nombre Poder'] || row['Nombre'] || '').trim();
                        return nombre && nombre.toLowerCase() !== 'nombre poder';
                    });

                    document.getElementById('loading').style.display = 'none';

                    allDisciplinesData.sort((a, b) => {
                        let lvlA = parseInt(a['Nivel'] || 1, 10);
                        let lvlB = parseInt(b['Nivel'] || 1, 10);
                        if (lvlA !== lvlB) return lvlA - lvlB;
                        return (a['Nombre Poder'] || '').localeCompare(b['Nombre Poder']);
                    });

                    populateFilters(allDisciplinesData);
                    renderCards(allDisciplinesData);
                },
                error: function(err) {
                    console.error("Error al cargar Google Sheets:", err);
                    document.getElementById('loading').textContent = "Error al cargar los datos del compendio.";
                }
            });
        };

        function populateFilters(data) {
            const disciplinesSet = new Set();
            data.forEach(row => {
                const disc = row['Disciplina'] || row['DISCIPLINA'];
                if (disc) disciplinesSet.add(disc.trim());
            });

            const selectDisc = document.getElementById('filterDiscipline');
            Array.from(disciplinesSet).sort().forEach(disc => {
                const opt = document.createElement('option');
                opt.value = disc.toLowerCase();
                opt.textContent = disc;
                selectDisc.appendChild(opt);
            });
        }

        function renderCards(data) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            data.forEach(row => {
                const name = row['Nombre Poder'] || row['Nombre'] || 'Sin Nombre';
                const nameEn = row['Name'] || row['Nombre Ingles'] || '';
                const discipline = row['Disciplina'] || 'General';
                const level = row['Nivel'] || '1';
                
                const pool = row['Reserva de Dados'] || row['Reserva de dados'] || row['Tirada'] || 'Especial';
                const cost = row['Controles de Ansia'] || row['Coste'] || 'Ninguno';
                const desc = row['Descripción'] || row['DESCRIPCION'] || 'Sin descripción disponible.';
                const source = row['Fuente_Libro'] || row['Fuente'] || 'V5';

                const discKey = discipline.toLowerCase().trim();
                const archivoIcono = ICONOS_MAP[discKey];
                let iconHTML = '';
                if (archivoIcono) {
                    iconHTML = `<img src="./iconos/${archivoIcono}" class="discipline-watermark-img" alt="${discipline}" onerror="this.style.display='none'">`;
                }

                let subtitleHTML = '';
                if (nameEn && nameEn.trim() !== '-' && nameEn.trim() !== '') {
                    subtitleHTML = `<div class="card-subtitle-en">(${nameEn})</div>`;
                }

                const card = document.createElement('div');
                card.className = 'vtm-card';
                card.setAttribute('data-discipline', discKey);
                card.setAttribute('data-level', level);
                card.setAttribute('data-name', name.toLowerCase());

                card.innerHTML = `
                    ${iconHTML}
                    <div class="card-header">
                        <span class="card-discipline">${discipline}</span>
                    </div>
                    <div class="card-titles-container">
                        <div class="card-title">${name}</div>
                        ${subtitleHTML}
                    </div>
                    <div class="card-top-row">
                        <div class="card-level-badge">Nivel ${level}</div>
                        <div class="card-attributes">
                            <div><span>Res:</span> ${pool}</div>
                            <div><span>Coste:</span> ${cost}</div>
                        </div>
                    </div>
                    <div class="card-body">
                        ${desc}
                    </div>
                    <div class="card-footer">
                        <span>V5 MDT</span>
                        <span>${source}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterCards() {
            const selectedDisc = document.getElementById('filterDiscipline').value;
            const selectedLevel = document.getElementById('filterLevel').value;
            const searchQuery = document.getElementById('searchCard').value.toLowerCase();

            const cards = document.querySelectorAll('.vtm-card');
            cards.forEach(card => {
                const disc = card.getAttribute('data-discipline');
                const level = card.getAttribute('data-level');
                const name = card.getAttribute('data-name');
                const text = card.textContent.toLowerCase();

                const matchesDisc = (selectedDisc === 'all' || disc.includes(selectedDisc));
                const matchesLevel = (selectedLevel === 'all' || level.trim() === selectedLevel);
                const matchesSearch = (!searchQuery || name.includes(searchQuery) || text.includes(searchQuery));

                if (matchesDisc && matchesLevel && matchesSearch) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compendio de Disciplinas V5 - Cartas Imprimibles</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

        :root {
            --bg-color: #f2f2f2;
            --card-bg: #ffffff;
            --text-main: #111111;
            --accent-blood: #5c101c;
            --accent-gold: #b38f58;
            --card-width: 63mm;
            --card-height: 88mm;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'EB Garamond', serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        /* Panel de control (Oculto al imprimir) */
        .no-print-controls {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            background: #ffffff;
            color: #1a1a1a;
            border: 2px solid var(--accent-blood);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--accent-blood);
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button, select, input {
            font-family: 'Cinzel', serif;
            padding: 8px 14px;
            background: var(--accent-blood);
            color: white;
            border: 1px solid var(--accent-gold);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        button:hover, select:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: var(--accent-gold);
            color: #1a1a1a;
            font-weight: 600;
        }

        .filters-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .filter-group label {
            display: block;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            margin-bottom: 5px;
            color: var(--accent-blood);
        }

        .filter-group select, .filter-group input {
            width: 100%;
            background: #fff;
            color: #1a1a1a;
            border: 1px solid var(--accent-blood);
            padding: 6px;
        }

        /* Cuadrícula de Cartas */
        .cards-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--card-width), 1fr));
            gap: 20px;
            justify-content: center;
        }

        /* DISEÑO DE CARTA FÍSICA V5 (Print-Friendly con Marca de Agua) */
        .vtm-card {
            width: var(--card-width);
            height: var(--card-height);
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 3px double var(--accent-blood);
            border-radius: 8px;
            padding: 4mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .vtm-card::after {
            content: "";
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 2px;
            border: 1px solid var(--accent-gold);
            border-radius: 6px;
            pointer-events: none;
        }

        /* Marca de agua translúcida de la disciplina al fondo */
        .discipline-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
            user-select: none;
        }

        .card-header {
            background: var(--accent-blood);
            color: white;
            padding: 3px 6px;
            border-radius: 3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
            position: relative;
            z-index: 1;
        }

        .card-discipline {
            font-family: 'Cinzel', serif;
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent-gold);
            font-weight: 700;
        }

        .card-level-badge {
            font-family: 'Cinzel', serif;
            font-size: 0.62rem;
            font-weight: 700;
            background: var(--accent-gold);
            color: #1a1a1a;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-title {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-blood);
            text-align: center;
            line-height: 1.1;
            margin: 2px 0;
            border-bottom: 1px solid var(--accent-gold);
            padding-bottom: 2px;
            position: relative;
            z-index: 1;
        }

        .card-attributes {
            font-size: 0.56rem;
            background: rgba(179, 143, 88, 0.12);
            border: 1px solid var(--accent-gold);
            padding: 2px 4px;
            border-radius: 3px;
            margin-bottom: 3px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            position: relative;
            z-index: 1;
        }

        .card-attributes div span {
            font-weight: bold;
            color: var(--accent-blood);
        }

        .card-body {
            font-size: 0.58rem;
            line-height: 1.2;
            overflow-y: hidden;
            flex-grow: 1;
            padding: 1px 2px;
            position: relative;
            z-index: 1;
            text-align: justify;
        }

        .card-footer {
            border-top: 1px solid var(--accent-gold);
            padding-top: 2px;
            font-size: 0.5rem;
            display: flex;
            justify-content: space-between;
            color: #444;
            font-family: 'Cinzel', serif;
            position: relative;
            z-index: 1;
        }

        /* Estilos limpios para impresión A4 */
        @media print {
            body {
                background: white !important;
                color: black !important;
                padding: 0 !important;
            }

            .no-print-controls {
                display: none !important;
            }

            .cards-grid {
                display: block;
                max-width: none;
                margin: 0;
            }

            .vtm-card {
                margin: 0;
                float: left;
                box-shadow: none !important;
                background-color: #fff !important;
                border: 1px solid #222 !important;
                page-break-inside: avoid;
                break-inside: avoid;
            }

            @page {
                size: A4;
                margin: 8mm;
            }
        }
    </style>
</head>
<body>

    <div class="no-print-controls">
        <div class="controls-header">
            <h1>🎴 Generador de Cartas VTM (Print-Friendly)</h1>
            <div class="btn-group">
                <a href="index.html" style="text-decoration: none;"><button type="button">⬅️ Volver al Compendio</button></a>
                <button class="btn-secondary" onclick="window.print()">🖨️ Imprimir Cartas (A4)</button>
            </div>
        </div>

        <div class="filters-row">
            <div class="filter-group">
                <label for="filterDiscipline">Filtrar Disciplina:</label>
                <select id="filterDiscipline" onchange="filterCards()">
                    <option value="all">Todas las Disciplinas</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterLevel">Filtrar Nivel:</label>
                <select id="filterLevel" onchange="filterCards()">
                    <option value="all">Todos los Niveles</option>
                    <option value="1">Nivel 1</option>
                    <option value="2">Nivel 2</option>
                    <option value="3">Nivel 3</option>
                    <option value="4">Nivel 4</option>
                    <option value="5">Nivel 5</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="searchCard">Buscar Poder:</label>
                <input type="text" id="searchCard" placeholder="Nombre o palabra clave..." oninput="filterCards()">
            </div>
        </div>
    </div>

    <div id="cardsContainer" class="cards-grid">
        </div>

    <script>
        let allDisciplinesData = [];

        // Mapeo automático de iconos para las marcas de agua de fondo
        const disciplineIcons = {
            "celeridad": "⚡",
            "potencia": "💪",
            "presencia": "👑",
            "auspex": "👁️",
            "dominación": "👁️‍🗨️",
            "animalismo": "🐺",
            "protean": "🐾",
            "olvido": "🌑",
            "oblivion": "🌑",
            "hechicería de sangre": "🩸",
            "fortaleza": "🛡️",
            "ofuscación": "👥"
        };

        // Carga automática al abrir la página utilizando tu enlace exacto de Google Sheets
        window.onload = function() {
            const sheetCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQaQJuLj6_QRdKghfXWQFV5NThMJF-tXWJDIRJiwShVfbusDaCsQbHL-ZFHL-NaB4DF9MCllinL6RfA/pub?gid=0&single=true&output=csv";

            Papa.parse(sheetCsvUrl, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    allDisciplinesData = results.data;
                    populateFilters(allDisciplinesData);
                    renderCards(allDisciplinesData);
                },
                error: function(err) {
                    console.error("Error al cargar Google Sheets:", err);
                    alert("No se pudieron cargar los datos del Google Sheets. Comprueba tu conexión.");
                }
            });
        };

        function populateFilters(data) {
            const disciplinesSet = new Set();
            data.forEach(row => {
                const disc = row.Disciplina || row.discipline || row.Clase;
                if (disc) disciplinesSet.add(disc.trim());
            });

            const selectDisc = document.getElementById('filterDiscipline');
            selectDisc.innerHTML = '<option value="all">Todas las Disciplinas</option>';
            disciplinesSet.forEach(disc => {
                const opt = document.createElement('option');
                opt.value = disc.toLowerCase();
                opt.textContent = disc;
                selectDisc.appendChild(opt);
            });
        }

        function renderCards(data) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            data.forEach(row => {
                const name = row.Nombre || row.name || row.Poder || 'Sin Nombre';
                const discipline = row.Disciplina || row.discipline || 'General';
                const level = row.Nivel || row.level || '1';
                const pool = row.Reserva || row.pool || 'Especial';
                const cost = row.Coste || row.cost || 'Ninguno';
                const desc = row.Sistema || row.Description || row.descripcion || row.Efecto || 'Sin descripción.';
                const source = row.Fuente || row.source || 'V5';

                const discKey = discipline.toLowerCase().trim();
                const icon = disciplineIcons[discKey] || '🦇';

                const card = document.createElement('div');
                card.className = 'vtm-card';
                card.setAttribute('data-discipline', discKey);
                card.setAttribute('data-level', level);
                card.setAttribute('data-name', name.toLowerCase());

                card.innerHTML = `
                    <div class="discipline-watermark">${icon}</div>
                    <div class="card-header">
                        <span class="card-discipline">${discipline}</span>
                        <span class="card-level-badge">${level}</span>
                    </div>
                    <div class="card-title">${name}</div>
                    <div class="card-attributes">
                        <div><span>Reserva:</span> ${pool}</div>
                        <div><span>Coste:</span> ${cost}</div>
                    </div>
                    <div class="card-body">
                        ${desc}
                    </div>
                    <div class="card-footer">
                        <span>V5 MDT</span>
                        <span>${source}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterCards() {
            const selectedDisc = document.getElementById('filterDiscipline').value;
            const selectedLevel = document.getElementById('filterLevel').value;
            const searchQuery = document.getElementById('searchCard').value.toLowerCase();

            const cards = document.querySelectorAll('.vtm-card');
            cards.forEach(card => {
                const disc = card.getAttribute('data-discipline');
                const level = card.getAttribute('data-level');
                const name = card.getAttribute('data-name');
                const text = card.textContent.toLowerCase();

                const matchesDisc = (selectedDisc === 'all' || disc.includes(selectedDisc));
                const matchesLevel = (selectedLevel === 'all' || level.trim() === selectedLevel);
                const matchesSearch = (!searchQuery || name.includes(searchQuery) || text.includes(searchQuery));

                if (matchesDisc && matchesLevel && matchesSearch) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compendio de Disciplinas - Vampiro: La Mascarada V5</title>
    <!-- Librería para procesar el CSV de Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #18181c;
            --card-border: #2a2a32;
            --accent-red: #8b0000;
            --accent-crimson: #c92a2a;
            --accent-gold: #c5a059;
            --text-main: #e1e1e6;
            --text-muted: #a0a0b0;
            --tag-bg: #25252e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Cabecera ajustada con Flexbox */
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            padding: 30px 20px;
            border-bottom: 2px solid var(--accent-red);
            margin-bottom: 30px;
            background: linear-gradient(180deg, rgba(139,0,0,0.15) 0%, rgba(15,15,18,0) 100%);
            border-radius: 8px 8px 0 0;
            text-align: left;
        }

        /* Estilo para el logo principal de la cabecera */
        .header-logo {
            height: 75px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0px 2px 8px rgba(201, 42, 42, 0.4));
        }

        .header-text {
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-family: 'Georgia', serif;
            font-size: 2.3rem;
            color: #fff;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
            text-shadow: 0 2px 10px rgba(201, 42, 42, 0.3);
            line-height: 1.1;
        }

        .subtitle {
            font-size: 1.05rem;
            color: var(--accent-gold);
            font-style: italic;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            background-color: var(--bg-color);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent-crimson);
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            background-color: var(--tag-bg);
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--accent-red);
            color: #fff;
            border-color: var(--accent-crimson);
        }

        .btn-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .discipline-section {
            margin-bottom: 40px;
        }

        .section-title {
            font-family: 'Georgia', serif;
            font-size: 1.8rem;
            color: var(--accent-gold);
            border-bottom: 1px solid rgba(197, 160, 89, 0.3);
            padding-bottom: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .discipline-icon {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background-color: var(--accent-red);
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(201, 42, 42, 0.4);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
        }

        .card-page {
            font-size: 0.8rem;
            background-color: rgba(139, 0, 0, 0.2);
            color: #ff8080;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(201, 42, 42, 0.3);
            white-space: nowrap;
        }

        .card-meta {
            font-size: 0.85rem;
            color: var(--accent-gold);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .card-roll {
            font-size: 0.9rem;
            color: #fff;
            background-color: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 6px;
            border-left: 3px solid var(--accent-crimson);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .card-desc {
            font-size: 0.93rem;
            color: var(--text-main);
            flex-grow: 1;
        }

        .card-notes {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed var(--card-border);
        }

        .card-tags {
            margin-top: 15px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            background-color: var(--tag-bg);
            color: var(--text-muted);
            border: 1px solid var(--card-border);
        }

        .badge-ceremonia {
            background-color: rgba(75, 0, 130, 0.3);
            border-color: rgba(138, 43, 226, 0.4);
            color: #d8b4fe;
        }

        .badge-ritual {
            background-color: rgba(139, 0, 0, 0.3);
            border-color: rgba(220, 20, 60, 0.4);
            color: #fca5a5;
        }

        .badge-duration {
            background-color: rgba(197, 160, 89, 0.15);
            border-color: rgba(197, 160, 89, 0.3);
            color: var(--accent-gold);
        }

        #loading {
            text-align: center;
            font-size: 1.2rem;
            color: var(--accent-gold);
            padding: 40px;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--card-border);
            margin-top: 50px;
        }

        /* Adaptación a móviles */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }
            .header-logo {
                height: 60px;
            }
            h1 { font-size: 1.7rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img src="iconos/logovtm.png" class="header-logo" alt="Logo VTM" onerror="this.onerror=null; this.src='Iconos/logovtm.png';">
        <div class="header-text">
            <h1>Compendio de Disciplinas</h1>
            <div class="subtitle">Guía de Juego - Vampiro: La Mascarada (5ª Edición)</div>
        </div>
    </header>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar por nombre, palabra clave, nivel..." oninput="applyFilters()">
        </div>
        <div class="filter-buttons" id="filterContainer">
            <button class="filter-btn active" data-discipline="all" onclick="filterDiscipline('all')">Todas</button>
        </div>
    </div>

    <div id="loading">Cargando grimorio desde Google Sheets...</div>

    <div id="disciplinesWrapper"></div>

    <footer>
        Compendio generado para Vampiro: La Mascarada 5ª Edición — Guía de Juego.
    </footer>
</div>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSbJqXkyep98lFMgASBnEKiloqmRoV2hJaLfKyTHNzIzoOXGuNUuqVtrs0rwis8hYsg_s66T7ek2gux/pub?output=csv';

    const ICONOS_MAP = {
        'Animalismo': 'Animalism_symbol.png',
        'Auspex': 'Auspex_symbol.png',
        'Celeridad': 'Celerity_symbol.png',
        'Dominación': 'Dominate_symbol.png',
        'Fortaleza': 'Fortitude_symbol.png',
        'Hechicería de Sangre': 'Blood_Sorcery_symbol.png',
        'Ofuscación': 'Obfuscate_symbol.png',
        'Olvido': 'Oblivion_symbol.png',
        'Potencia': 'Potence_symbol.png',
        'Presencia': 'Presence_symbol.png',
        'Protean': 'Protean_symbol.png',
        'Alquimia de Sangre Débil': 'Alchemy_symbol.png'
    };

    let datosGlobales = [];
    let currentFilter = 'all';

    function esFilaValida(item) {
        if (!item) return false;
        const nombre = (item['Nombre'] || '').trim().toLowerCase();
        const disc = (item['Disciplina'] || '').trim().toLowerCase();
        
        if (nombre === 'nombre' || disc === 'disciplina') return false;
        return true;
    }

    window.addEventListener('DOMContentLoaded', () => {
        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                datosGlobales = results.data.filter(esFilaValida);
                document.getElementById('loading').style.display = 'none';
                construirFiltros(datosGlobales);
                renderizarCompendio(datosGlobales);
            }
        });
    });

    function construirFiltros(datos) {
        const disciplinas = [...new Set(datos.map(item => item['Disciplina']).filter(Boolean))].sort();
        const container = document.getElementById('filterContainer');
        
        disciplinas.forEach(disc => {
            if (disc.toLowerCase() === 'disciplina') return;

            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.setAttribute('data-discipline', disc);
            btn.onclick = () => filterDiscipline(disc);

            const nombreArchivo = ICONOS_MAP[disc];
            let imgHTML = '';
            if (nombreArchivo) {
                imgHTML = `<img src="iconos/${nombreArchivo}" class="btn-icon" onerror="this.onerror=null; this.src='Iconos/${nombreArchivo}';">`;
            }

            btn.innerHTML = `${imgHTML} <span>${disc}</span>`;
            container.appendChild(btn);
        });
    }

    function renderizarCompendio(datos) {
        const wrapper = document.getElementById('disciplinesWrapper');
        wrapper.innerHTML = '';

        const agrupados = {};
        datos.forEach(row => {
            const disc = row['Disciplina'] || 'Otras';
            if (disc.toLowerCase() === 'disciplina') return;
            
            if (!agrupados[disc]) agrupados[disc] = [];
            agrupados[disc].push(row);
        });

        Object.keys(agrupados).sort().forEach(disc => {
            const sec = document.createElement('div');
            sec.className = 'discipline-section';
            sec.setAttribute('data-discipline', disc);

            const nombreArchivo = ICONOS_MAP[disc];
            
            let imgHTML = '';
            if (nombreArchivo) {
                imgHTML = `<img src="iconos/${nombreArchivo}" class="discipline-icon" onerror="this.onerror=null; this.src='Iconos/${nombreArchivo}';">`;
            }

            sec.innerHTML = `
                <h2 class="section-title">
                    ${imgHTML}
                    <span>${disc}</span>
                </h2>
                <div class="grid"></div>
            `;

            const grid = sec.querySelector('.grid');

            agrupados[disc].forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('data-name', item['Nombre'] || '');
                card.setAttribute('data-desc', item['Descripción'] || '');

                let metaPartes = [];
                if (item['Nivel'] && item['Nivel'] !== '-') metaPartes.push(`Nivel ${item['Nivel']}`);
                if (item['Coste'] && item['Coste'] !== '-') metaPartes.push(`Coste: ${item['Coste']}`);
                if (item['Amalgama'] && item['Amalgama'] !== '-') metaPartes.push(`Amalgama: ${item['Amalgama']}`);
                if (item['Requisito'] && item['Requisito'] !== '-') metaPartes.push(`Req: ${item['Requisito']}`);
                
                const metaText = metaPartes.join(' • ');

                let rollHTML = '';
                const reservaDados = item['Reserva de dados'] || item['Reserva de Dados'] || item['Tirada'];
                const reservaOposicion = item['Reserva de oposición'] || item['Reserva de Oposición'] || item['Oposición'];

                if (reservaDados && reservaDados !== '-') {
                    let textTirada = `🎲 <strong>Tirada:</strong> ${reservaDados}`;
                    if (reservaOposicion && reservaOposicion !== '-') {
                        textTirada += ` <em>vs</em> ${reservaOposicion}`;
                    }
                    rollHTML = `<div class="card-roll">${textTirada}</div>`;
                }

                let notesHTML = '';
                const notas = item['Notas adicionales'] || item['Notas'] || item['Efecto rápido'];
                if (notas && notas !== '-') {
                    notesHTML = `<div class="card-notes">📌 ${notas}</div>`;
                }

                let badgeTipo = `<span class="badge">${item['Tipo'] || 'Poder'}</span>`;
                if (item['Tipo'] && item['Tipo'].toLowerCase().includes('ceremonia')) {
                    badgeTipo = `<span class="badge badge-ceremonia">${item['Tipo']}</span>`;
                } else if (item['Tipo'] && item['Tipo'].toLowerCase().includes('ritual')) {
                    badgeTipo = `<span class="badge badge-ritual">${item['Tipo']}</span>`;
                }

                let badgeDuracion = '';
                if (item['Duración'] && item['Duración'] !== '-') {
                    badgeDuracion = `<span class="badge badge-duration">⏳ ${item['Duración']}</span>`;
                }

                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <div class="card-title">${item['Nombre'] || 'Sin Nombre'}</div>
                            ${item['Fuente'] ? `<div class="card-page">${item['Fuente']}</div>` : ''}
                        </div>
                        ${metaText ? `<div class="card-meta">${metaText}</div>` : ''}
                        ${rollHTML}
                        <div class="card-desc">${item['Descripción'] || ''}</div>
                        ${notesHTML}
                    </div>
                    <div class="card-tags">
                        ${badgeTipo}
                        ${badgeDuracion}
                        <span class="badge">${disc}</span>
                    </div>
                `;

                grid.appendChild(card);
            });

            wrapper.appendChild(sec);
        });
    }

    function filterDiscipline(discipline) {
        currentFilter = discipline;
        
        const buttons = document.querySelectorAll('.filter-btn');
        buttons.forEach(btn => {
            const btnDisc = btn.getAttribute('data-discipline');
            if ((btnDisc === 'all' && discipline === 'all') || btnDisc === discipline) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        applyFilters();
    }

    function applyFilters() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const sections = document.querySelectorAll('.discipline-section');

        sections.forEach(section => {
            const secDiscipline = section.getAttribute('data-discipline');
            const cards = section.querySelectorAll('.card');
            let visibleCardsInSection = 0;

            const matchesDiscipline = (currentFilter === 'all' || currentFilter === secDiscipline);

            cards.forEach(card => {
                const name = card.getAttribute('data-name').toLowerCase();
                const desc = card.getAttribute('data-desc').toLowerCase();
                const text = card.textContent.toLowerCase();

                const matchesSearch = !query || name.includes(query) || desc.includes(query) || text.includes(query);

                if (matchesDiscipline && matchesSearch) {
                    card.style.display = 'flex';
                    visibleCardsInSection++;
                } else {
                    card.style.display = 'none';
                }
            });

            if (visibleCardsInSection > 0) {
                section.style.display = 'block';
            } else {
                section.style.display = 'none';
            }
        });
    }
</script>

</body>
</html>

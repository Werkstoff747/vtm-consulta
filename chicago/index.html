<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Censo de Chicago y La Cloaca Carmesí</title>

    <link rel="icon" type="image/png" href="./iconos/drRol.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #18181c;
            --card-border: #2a2a32;
            --accent-red: #8b0000;
            --accent-gold: #c5a059;
            --text-main: #e1e1e6;
            --text-muted: #a0a0b0;
        }

        body.light-mode {
            --bg-color: #a8a7a4;
            --card-bg: #ffffff;
            --card-border: #bcaba0;
            --accent-red: #8b0000;
            --accent-gold: #8d6722;
            --text-main: #1f1f22;
            --text-muted: #555459;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 2px solid var(--accent-red);
            margin-bottom: 20px;
            background: var(--card-bg);
            border-radius: 8px;
        }

        .home-btn {
            color: var(--accent-gold);
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        /* PANEL DE NARRADOR Y FILTROS */
        .narrator-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .narrator-panel.active {
            display: block;
        }

        .filters-group {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 10px;
            font-size: 0.9rem;
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
        }

        .filters-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        /* LISTADO DE PERSONAJES */
        .roster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .character-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 15px;
            border-radius: 6px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .character-card:hover {
            border-color: var(--accent-gold);
        }
        .card-name {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            color: var(--accent-gold);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <a href="https://werkstoff747.github.io/vtm-consulta" class="home-btn"><i class="fa-solid fa-house"></i> Menú Principal</a>
        <h1>Censo de Vástagos</h1>
        <button onclick="toggleNarratorMode()" style="background:none; border:1px solid var(--accent-gold); color:var(--accent-gold); padding:5px 10px; border-radius:4px; cursor:pointer;"><i class="fa-solid fa-key"></i></button>
    </header>

    <!-- PANEL EXCLUSIVO NARRADOR CON CHECKBOXES DE FUENTES -->
    <div id="narratorPanel" class="narrator-panel">
        <strong style="font-family: 'Cinzel', serif; color: var(--accent-gold);">Panel de Narrador - Filtrar Fuentes:</strong>
        <div class="filters-group">
            <label><input type="checkbox" id="checkCN" checked onchange="saveFiltersAndRender()"> CN (Chicago Nocturno)</label>
            <label><input type="checkbox" id="checkCC" checked onchange="saveFiltersAndRender()"> CC (Cloaca Carmesí)</label>
        </div>
    </div>

    <div id="rosterList" class="roster-grid">
        <p style="color: var(--text-muted);">Cargando censo...</p>
    </div>
</div>

<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vShpjd_tcI1PIo1fdPGcBrsvkGw9NHvKv6YkDlMF7NaU_2F8W18YsqaTkGV8yPO2lPIZZVjKet_haOd/pub?gid=1319625641&single=true&output=csv';
    let globalCharactersData = [];

    // Comprobar estado inicial del Narrador
    function initNarratorMode() {
        const isNarrator = localStorage.getItem('vtm-narrator') === 'true';
        if (isNarrator) {
            document.getElementById('narratorPanel').classList.add('active');
        }
        
        // Cargar preferencias de fuentes guardadas
        const savedCN = localStorage.getItem('vtm-filter-cn');
        const savedCC = localStorage.getItem('vtm-filter-cc');
        
        if (savedCN !== null) document.getElementById('checkCN').checked = (savedCN === 'true');
        if (savedCC !== null) document.getElementById('checkCC').checked = (savedCC === 'true');
    }

    function toggleNarratorMode() {
        const panel = document.getElementById('narratorPanel');
        const isActive = panel.classList.toggle('active');
        localStorage.setItem('vtm-narrator', isActive);
    }

    function saveFiltersAndRender() {
        const showCN = document.getElementById('checkCN').checked;
        const showCC = document.getElementById('checkCC').checked;
        
        localStorage.setItem('vtm-filter-cn', showCN);
        localStorage.setItem('vtm-filter-cc', showCC);

        renderRoster(globalCharactersData);
    }

    window.addEventListener('DOMContentLoaded', () => {
        initNarratorMode();

        Papa.parse(SHEET_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                globalCharactersData = results.data;
                renderRoster(globalCharactersData);
            },
            error: function(err) {
                document.getElementById('rosterList').innerHTML = '<p style="color:red;">Error al cargar el censo.</p>';
            }
        });
    });

    function renderRoster(data) {
        const container = document.getElementById('rosterList');
        container.innerHTML = '';

        const showCN = document.getElementById('checkCN').checked;
        const showCC = document.getElementById('checkCC').checked;
        const isNarrator = document.getElementById('narratorPanel').classList.contains('active');

        data.forEach(v => {
            const fuente = (v["Fuente"] || "CN").trim().toUpperCase(); // Asumiendo columna "Fuente" en el CSV (CN o CC)

            // Si el modo narrador está activo, filtramos según los checkboxes
            if (isNarrator) {
                if (fuente === 'CN' && !showCN) return;
                if (fuente === 'CC' && !showCC) return;
            }

            const nombre = v["Nombre_Personaje"] || v["Nombre del Personaje"] || "Sin Nombre";
            const clan = v["Clan"] || "Desconocido";
            const id = v["ID"] || "";
            const isCloaca = fuente === 'CC';

            const card = document.createElement('a');
            card.className = 'character-card';
            // Dependiendo de si es de la Cloaca o de Chicago, redirige a su respectiva plantilla
            card.href = isCloaca ? `ficha_cloaca2.html?id=${id}` : `ficha_cloaca.html?id=${id}`;
            card.innerHTML = `
                <div class="card-name">${nombre}</div>
                <div style="font-size: 0.85rem; color: var(--text-muted);">${clan} [${fuente}]</div>
            `;
            container.appendChild(card);
        });
    }
</script>

</body>
</html>

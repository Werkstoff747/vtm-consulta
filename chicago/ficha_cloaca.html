<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personaje - La Cloaca Carmesí</title>

    <link rel="icon" type="image/png" href="./iconos/drRol.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #18181c;
            --card-border: #2a2a32;
            --accent-red: #8b0000;
            --accent-crimson: #c92a2a;
            --accent-gold: #c5a059;
            --text-main: #e1e1e6;
            --text-muted: #a0a0b0;
            --tag-bg: #25252e;
            --input-bg: #0f0f12;
            --header-bg: linear-gradient(180deg, rgba(139,0,0,0.3) 0%, rgba(15,15,18,0) 100%);
            --header-border: #8b0000;
            --card-title-color: #ffffff;
            --card-notes-bg: rgba(255, 255, 255, 0.03);
        }

        body.light-mode {
            --bg-color: #a8a7a4;
            --card-bg: #ffffff;
            --card-border: #bcaba0;
            --accent-red: #8b0000;
            --accent-crimson: #c92a2a;
            --accent-gold: #8d6722;
            --text-main: #1f1f22;
            --text-muted: #555459;
            --tag-bg: #f2f0eb;
            --input-bg: #ffffff;            
            --header-bg: #2b0408;
            --header-border: #7a0000;
            --card-title-color: #111115;
            --card-notes-bg: #f9f8f5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container { max-width: 1050px; margin: 0 auto; width: 100%; }

        header {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 20px;
            border-bottom: 2px solid var(--header-border);
            margin-bottom: 25px;
            background: var(--header-bg);
            border-radius: 8px;
            text-align: center;
        }

        h1.cabecera-principal {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--accent-gold);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .sheet-container {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 25px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 25px;
            position: relative;
            margin-bottom: 40px;
        }

        .sheet-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 4px; height: 100%;
            background-color: var(--accent-red);
            z-index: 5;
        }

        .sheet-img-box {
            width: 100%;
            height: 380px;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }

        .sheet-img-box img {
            width: 100%; height: 100%; object-fit: cover; object-position: top;
        }

        .sheet-details {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sheet-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--card-title-color, #fff);
            border-bottom: 1px dashed var(--card-border);
            padding-bottom: 8px;
            text-transform: uppercase;
        }

        .sheet-grid-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .info-block {
            font-size: 0.88rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-notes-bg);
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
        }

        .info-label { color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
        .info-value { font-weight: 600; text-align: right; color: var(--text-main); }

        .section-title {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            font-size: 1rem;
            margin-top: 15px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .three-cols-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 8px;
        }
        @media (max-width: 750px) {
            .three-cols-grid { grid-template-columns: 1fr; }
        }

        .pool-col-box {
            background: var(--card-notes-bg);
            border: 1px solid var(--card-border);
            padding: 8px 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
        }
        .pool-col-label {
            font-weight: 600;
            color: var(--accent-gold);
            font-family: 'Cinzel', serif;
        }
        .pool-col-value {
            font-weight: 700;
            color: var(--card-title-color, #fff);
            font-family: 'Cinzel', serif;
            font-size: 1rem;
        }

        .disciplines-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 8px;
        }
        @media (max-width: 750px) {
            .disciplines-grid { grid-template-columns: 1fr; }
        }

        .discipline-card {
            background: var(--card-notes-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 10px;
        }
        .discipline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--card-border);
            padding-bottom: 5px;
            margin-bottom: 6px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            color: var(--accent-gold);
            font-size: 0.9rem;
        }
        .discipline-powers-list {
            list-style-type: disc;
            padding-left: 16px;
            font-size: 0.82rem;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .secrets-box {
            background: rgba(139, 0, 0, 0.08);
            border: 1px solid rgba(139, 0, 0, 0.3);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-top: 8px;
            color: var(--accent-gold);
            font-style: italic;
        }

        #loading, #error-msg {
            text-align: center;
            font-size: 1.1rem;
            color: var(--accent-gold);
            padding: 40px;
            font-family: 'Cinzel', serif;
        }

        footer { text-align: center; padding: 20px; border-top: 1px solid var(--card-border); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 class="cabecera-principal">Ficha de Personaje — La Cloaca Carmesí</h1>
    </header>

    <div id="loading">Cargando datos de la ficha...</div>
    <div id="error-msg" style="display:none;">Personaje no encontrado en los archivos de la Cloaca Carmesí o parámetro ID ausente.</div>
    
    <div id="sheetContent" style="display: none;" class="sheet-container"></div>

    <footer>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Vampiro: La Mascarada (5ª Edición) — Archivos de la Cloaca</p>
    </footer>
</div>

<script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vShpjd_tcI1PIo1fdPGcBrsvkGw9NHvKv6YkDlMF7NaU_2F8W18YsqaTkGV8yPO2lPIZZVjKet_haOd/pub?gid=1319625641&single=true&output=csv';

    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const personajeId = urlParams.get('id');

        if (!personajeId) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-msg').style.display = 'block';
            return;
        }

        Papa.parse(SHEET_CSV_URL, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                document.getElementById('loading').style.display = 'none';
                const personaje = results.data.find(v => String(v["ID"] || "").trim() === String(personajeId).trim());
                if (personaje) {
                    renderFicha(personaje);
                } else {
                    document.getElementById('error-msg').style.display = 'block';
                }
            },
            error: function(err) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error-msg').textContent = "Error al conectar con los datos de la Cloaca.";
                document.getElementById('error-msg').style.display = 'block';
            }
        });
    });

    function renderExcepcionales(textoExcepcionales) {
        if (!textoExcepcionales || textoExcepcionales.trim() === '-' || textoExcepcionales.trim() === '') {
            return '<span style="font-size: 0.85rem; color: var(--text-muted); font-style: italic; grid-column: span 3;">Sin reservas excepcionales registradas.</span>';
        }

        let html = '';
        const items = textoExcepcionales.split(',');
        items.forEach(item => {
            const parts = item.trim().match(/^(.+?)\s+(\d+)$/);
            let nombrePool = item.trim();
            let valorPool = "-";

            if (parts) {
                nombrePool = parts[1].trim();
                valorPool = parts[2].trim();
            }

            html += `
                <div class="pool-col-box">
                    <span class="pool-col-label">${nombrePool}:</span>
                    <span class="pool-col-value">${valorPool}</span>
                </div>
            `;
        });
        return html;
    }

    function renderDisciplinas(textoDisciplinas) {
        if (!textoDisciplinas || textoDisciplinas.trim() === '-' || textoDisciplinas.trim() === '') {
            return '<span style="font-size: 0.85rem; color: var(--text-muted); font-style: italic; grid-column: span 3;">Sin disciplinas registradas.</span>';
        }

        const regex = /([A-Za-zñÑáéíóúÁÉÍÓÚ\s]+?)\s*(\d+)(?:\s*\((.*?)\))?/g;
        let match;
        let html = '';
        let count = 0;

        while ((match = regex.exec(textoDisciplinas)) !== null) {
            count++;
            const nombreDisc = match[1].trim();
            const nivelDisc = match[2].trim();
            const poderesRaw = match[3] ? match[3].trim() : "";
            const poderesList = poderesRaw ? poderesRaw.split(',').map(p => p.trim()) : [];

            let poderesHtml = '';
            if (poderesList.length > 0) {
                poderesHtml = '<ul class="discipline-powers-list">';
                poderesList.forEach(pod => {
                    poderesHtml += `<li>${pod}</li>`;
                });
                poderesHtml += '</ul>';
            } else {
                poderesHtml = '<span style="font-size: 0.82rem; color: var(--text-muted); font-style: italic;">Sin poderes específicos detallados.</span>';
            }

            html += `
                <div class="discipline-card">
                    <div class="discipline-header">
                        <span>${nombreDisc}</span>
                        <span class="pool-col-value">${nivelDisc}</span>
                    </div>
                    ${poderesHtml}
                </div>
            `;
        }

        if (count === 0) {
            return `<span style="font-size: 0.9rem; color: var(--text-main); grid-column: span 3;">${textoDisciplinas}</span>`;
        }

        return html;
    }

    function renderFicha(v) {
        const container = document.getElementById('sheetContent');
        container.style.display = 'grid';

        const id = v["ID"] || "";
        const nombre = v["Nombre_Personaje"] || v["Nombre del Personaje"] || "Desconocido";
        const clan = v["Clan"] || "Desconocido";
        const apodoRango = v["Apodo_o_Rango"] || "";
        const sire = v["Sire"] || "";
        const abrazo = v["Abrazo"] || "";
        const ambicion = v["Ambicion"] || "";
        const convicciones = v["Convicciones"] || "";
        const piedrasToque = v["Piedras_de_Toque"] || "";
        const humanidad = v["Humanidad"] || "";
        const generacion = v["Generacion"] || "";
        const potenciaSangre = v["Potencia_de_Sangre"] || "";
        const salud = v["Salud"] || "";
        const fuerzaVoluntad = v["Fuerza_de_Voluntad"] || "";
        
        const poolFisicos = v["Pool_Fisicos"] || "-";
        const poolSociales = v["Pool_Sociales"] || "-";
        const poolMentales = v["Pool_Mentales"] || "-";
        
        const textoDisciplinas = v["Disciplinas"] || "";
        const reservasExcepcionales = v["Reservas_Excepcionales"] || "";
        const disciplinasVentajas = v["DisciplinasVentajas_y_Defectos"] || "";
        const secretos = v["Secretos"] || "";

        const cleanId = String(id).trim();
        const imagenPorId = cleanId ? `${cleanId}.jpg` : '';
        const imagenLimpia = v["Archivo de Imagen"] || v["Archivo_de_Imagen"] || imagenPorId || 'silueta.jpg';

        container.innerHTML = `
            <div>
                <div class="sheet-img-box">
                    <img src="./retratos/${imagenLimpia}" alt="${nombre}" onerror="this.onerror=null; this.src='./retratos/silueta.jpg';">
                </div>
            </div>
            <div class="sheet-details">
                <div class="sheet-title">${nombre}</div>
                
                <div class="sheet-grid-info">
                    <div class="info-block"><span class="info-label">Clan:</span><span class="info-value">${clan}</span></div>
                    <div class="info-block"><span class="info-label">Apodo / Rango:</span><span class="info-value">${apodoRango}</span></div>
                    <div class="info-block"><span class="info-label">Sire:</span><span class="info-value">${sire || "-"}</span></div>
                    <div class="info-block"><span class="info-label">Abrazo:</span><span class="info-value">${abrazo || "-"}</span></div>
                    <div class="info-block"><span class="info-label">Generación:</span><span class="info-value">${generacion || "-"}</span></div>
                    <div class="info-block"><span class="info-label">Potencia de Sangre:</span><span class="info-value">${potenciaSangre || "-"}</span></div>
                    <div class="info-block"><span class="info-label">Humanidad:</span><span class="info-value">${humanidad || "-"}</span></div>
                    <div class="info-block"><span class="info-label">Salud / Voluntad:</span><span class="info-value">${salud || "-"} / ${fuerzaVoluntad || "-"}</span></div>
                </div>

                <div class="section-title">Crónica y Moral</div>
                <div class="sheet-grid-info">
                    <div class="info-block" style="grid-column: span 2;"><span class="info-label">Ambición:</span><span class="info-value">${ambicion || "-"}</span></div>
                    <div class="info-block" style="grid-column: span 2;"><span class="info-label">Convicciones:</span><span class="info-value">${convicciones || "-"}</span></div>
                    <div class="info-block" style="grid-column: span 2;"><span class="info-label">Piedras de Toque:</span><span class="info-value">${piedrasToque || "-"}</span></div>
                </div>

                <div class="section-title">Reservas de Dados (Físicos, Sociales, Mentales)</div>
                <div class="three-cols-grid">
                    <div class="pool-col-box"><span class="pool-col-label">Físicos:</span> <span class="pool-col-value">${poolFisicos}</span></div>
                    <div class="pool-col-box"><span class="pool-col-label">Sociales:</span> <span class="pool-col-value">${poolSociales}</span></div>
                    <div class="pool-col-box"><span class="pool-col-label">Mentales:</span> <span class="pool-col-value">${poolMentales}</span></div>
                </div>

                <div class="section-title">Reservas Excepcionales</div>
                <div class="three-cols-grid">
                    ${renderExcepcionales(reservasExcepcionales)}
                </div>

                <div class="section-title">Disciplinas y Poderes</div>
                <div class="disciplines-grid">
                    ${renderDisciplinas(textoDisciplinas)}
                </div>

                ${disciplinasVentajas ? `
                    <div class="section-title">Ventajas y Defectos</div>
                    <div class="info-block" style="background: var(--card-notes-bg); display: block; padding: 8px 12px;">
                        <span class="info-value" style="text-align: left; display: block; font-weight: normal; font-style: italic;">${disciplinasVentajas}</span>
                    </div>
                ` : ''}

                ${secretos ? `
                    <div class="section-title">Secretos de Narrador</div>
                    <div class="secrets-box">
                        🦇 <strong>Secretos:</strong> <span>${secretos}</span>
                    </div>
                ` : ''}
            </div>
        `;
    }
</script>

</body>
</html>

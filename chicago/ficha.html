<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Personaje - Censo de Chicago</title>

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="./iconos/drRol.png">
    
    <!-- FUENTES OFICIALES V5 (Cinzel) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- PapaParse para leer Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #18181c;
            --card-border: #2a2a32;
            --accent-red: #8b0000;
            --accent-crimson: #c92a2a;
            --accent-gold: #c5a059;
            --text-main: #e1e1e6;
            --text-muted: #a0a0b0;
            --tag-bg: #25252e;
            --header-bg: linear-gradient(180deg, rgba(139,0,0,0.3) 0%, rgba(15,15,18,0) 100%);
            --header-border: #8b0000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .container { max-width: 1000px; margin: 0 auto; width: 100%; }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            border-bottom: 2px solid var(--header-border);
            margin-bottom: 25px;
            background: var(--header-bg);
            border-radius: 8px;
        }

        .back-btn {
            color: var(--accent-gold);
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }
        .back-btn:hover { opacity: 0.8; }

        h1.cabecera-principal {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--accent-gold);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .sheet-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 25px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            position: relative;
            margin-bottom: 40px;
        }
        .sheet-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background-color: var(--accent-red); border-top-left-radius: 8px; border-bottom-left-radius: 8px;
        }

        @media (max-width: 768px) {
            .sheet-card { grid-template-columns: 1fr; }
        }

        .sheet-img-container {
            width: 100%; height: 380px; background: #000; border-radius: 6px; overflow: hidden; border: 1px solid var(--card-border);
        }
        .sheet-img-container img { width: 100%; height: 100%; object-fit: cover; object-position: top; }

        .sheet-details { display: flex; flex-direction: column; gap: 15px; }

        .sheet-title-area { border-bottom: 1px dashed var(--card-border); padding-bottom: 12px; }
        .sheet-name { font-family: 'Cinzel', serif; font-size: 1.8rem; color: #fff; font-weight: 700; }
        .sheet-clan { font-size: 1.1rem; color: var(--accent-gold); font-style: italic; font-weight: 600; }

        .sheet-grid-info {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .info-label { color: var(--text-muted); font-weight: 600; display: block; font-size: 0.8rem; }
        .info-val { font-weight: 600; color: var(--text-main); }

        .stats-section { margin-top: 10px; }
        .stats-title { font-family: 'Cinzel', serif; color: var(--accent-gold); font-size: 1rem; margin-bottom: 8px; border-bottom: 1px solid var(--card-border); padding-bottom: 4px; }
        
        .stats-container {
            display: flex; flex-wrap: wrap; gap: 6px;
        }
        .stat-badge {
            background: var(--tag-bg);
            border: 1px solid var(--card-border);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        #loading, #error-msg {
            text-align: center; font-family: 'Cinzel', serif; color: var(--accent-gold); padding: 50px; font-size: 1.2rem;
        }
        #error-msg { color: var(--accent-crimson); }

        footer { text-align: center; padding: 20px; border-top: 1px solid var(--card-border); color: var(--text-muted); font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Volver al Censo</a>
        <h1 class="cabecera-principal">Hoja Técnica del Vástago</h1>
    </header>

    <div id="loading">Consultando Archivos de la Camarilla...</div>
    <div id="error-msg" style="display: none;"></div>

    <div id="fichaContent" style="display: none;">
        <div class="sheet-card">
            <div class="sheet-img-container">
                <img id="fImage" src="" alt="Retrato" onerror="this.src='https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?auto=format&fit=crop&w=500&q=80';">
            </div>
            <div class="sheet-details">
                <div class="sheet-title-area">
                    <div id="fName" class="sheet-name">Cargando...</div>
                    <div id="fClan" class="sheet-clan">Clan</div>
                </div>

                <div class="sheet-grid-info">
                    <div class="info-box"><span class="info-label">Rango / Título</span><span id="fRango" class="info-val">-</span></div>
                    <div class="info-box"><span class="info-label">Ubicación Habitual</span><span id="fUbicacion" class="info-val">-</span></div>
                    <div class="info-box"><span class="info-label">Facción</span><span id="fFaccion" class="info-val">-</span></div>
                    <div class="info-box"><span class="info-label">Sire / Creador</span><span id="fSire" class="info-val">-</span></div>
                </div>

                <div class="stats-section">
                    <div class="stats-title">Menciones en Crónica</div>
                    <div id="fMenciones" class="info-val" style="font-size: 0.85rem; color: var(--text-muted); font-style: italic;">-</div>
                </div>

                <div class="stats-section">
                    <div class="stats-title">Estadísticas y Disciplinas</div>
                    <div id="fStatsContainer" class="stats-container">
                        <!-- Las estadísticas de la tabla de atributos se inyectarán aquí dinámicamente -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        Censo de Chicago — Vampiro: La Mascarada 5ª Edición
    </footer>
</div>

<script>
    // URL de tu hoja de Google Sheets (asegúrate de que sea la misma o la de tu pestaña de estadísticas si la tienes separada)
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vShpjd_tcI1PIo1fdPGcBrsvkGw9NHvKv6YkDlMF7NaU_2F8W18YsqaTkGV8yPO2lPIZZVjKet_haOd/pub?output=csv';

    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const targetId = urlParams.get('id');

        if (!targetId) {
            mostrarError("No se ha especificado ningún ID de Vástago.");
            return;
        }

        Papa.parse(SHEET_CSV_URL, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(results) {
                document.getElementById('loading').style.display = 'none';
                
                // Buscamos la fila cuyo ID coincida (limpiando posibles espacios o ceros)
                const v = results.data.find(row => String(Number(row["ID"])) === String(Number(targetId)));

                if (v) {
                    renderFicha(v);
                } else {
                    mostrarError("No se ha encontrado ningún registro con el ID #" + targetId);
                }
            },
            error: function(err) {
                document.getElementById('loading').style.display = 'none';
                mostrarError("Error al conectar con la base de datos de Google Sheets.");
            }
        });
    });

    function renderFicha(v) {
        document.getElementById('fichaContent').style.display = 'block';

        const nombre = v["Nombre del Personaje"] || "Desconocido";
        const clan = v["Clan"] || "Desconocido";
        const imagen = v["Archivo de Imagen"] || "";
        
        document.getElementById('fName').textContent = nombre;
        document.getElementById('fClan').textContent = clan;
        document.getElementById('fRango').textContent = v["Rango / Título"] || "Sin Rango";
        document.getElementById('fUbicacion').textContent = v["Ubicación / Dominio habitual"] || "Desconocida";
        document.getElementById('fFaccion').textContent = v["Facción"] || "Independiente";
        document.getElementById('fSire'] = v["Sire / Creador"] || "Desconocido";
        
        // RUTA DE LA IMAGEN CORRECTA EN LA CARPETA LOCAL
        if (imagen) {
            document.getElementById('fImage').src = `./retratos/${imagen}`;
        }

        document.getElementById('fMenciones').textContent = v["Menciones"] || "Sin menciones registradas.";

        // Recorremos el resto de columnas del CSV por si tienes estadísticas adicionales (atributos, disciplinas, etc.)
        const statsContainer = document.getElementById('fStatsContainer');
        statsContainer.innerHTML = '';

        // Excluimos las columnas principales para pintar el resto como atributos/estadísticas dinámicas
        const excludeKeys = ["ID", "Archivo de Imagen", "Nombre del Personaje", "Clan", "Rango / Título", "Ubicación / Dominio habitual", "Facción", "Sire / Creador", "Ficha / Perfil", "Menciones", "Secretos", "Notas o Secretos"];
        
        let hasExtraStats = false;
        for (const [key, value] of Object.entries(v)) {
            if (!excludeKeys.includes(key) && value && value.trim() !== "" && value !== "0") {
                hasExtraStats = true;
                const badge = document.createElement('div');
                badge.className = 'stat-badge';
                badge.innerHTML = `<strong>${key}:</strong> ${value}`;
                statsContainer.appendChild(badge);
            }
        }

        if (!hasExtraStats) {
            statsContainer.innerHTML = '<span style="color: var(--text-muted); font-size: 0.85rem; font-style: italic;">No hay estadísticas adicionales registradas en esta hoja.</span>';
        }
    }

    function mostrarError(mensaje) {
        const errDiv = document.getElementById('error-msg');
        errDiv.textContent = mensaje;
        errDiv.style.display = 'block';
    }
</script>

</body>
</html>

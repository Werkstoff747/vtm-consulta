<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Cartas - Vampiro V5</title>
    <!-- Librería PapaParse para leer tu Google Sheet dinámicamente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @page {
            size: A4;
            margin: 10mm;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f0;
            color: #111115;
            margin: 0;
            padding: 20px;
        }

        .no-print {
            text-align: center;
            margin-bottom: 20px;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .no-print button {
            background-color: #5c101c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .no-print button:hover {
            background-color: #8b0000;
        }

        /* Contenedor de la página A4 */
        .a4-page {
            width: 210mm;
            height: 297mm;
            background: #ffffff;
            margin: 0 auto 10mm auto;
            padding: 10mm;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(3, 63.5mm);
            grid-template-rows: repeat(3, 88.9mm);
            gap: 4mm;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
            page-break-after: always;
        }

        /* Estilo individual de la carta (Tamaño Póker estándar: 63.5mm x 88.9mm) */
        .carta {
            width: 63.5mm;
            height: 88.9mm;
            border: 2mm solid #5c101c; /* Borde granate oficial V5 */
            border-radius: 4px;
            padding: 3mm;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Logo de la disciplina de fondo casi transparente (ahorro de tinta) */
        .logo-fondo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55%;
            opacity: 0.07; /* Muy atenuado para no gastar tinta ni molestar la lectura */
            z-index: 0;
            pointer-events: none;
        }

        /* Contenido de la carta por encima del logo */
        .contenido-carta {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }

        .card-header {
            border-bottom: 1px solid #5c101c;
            padding-bottom: 1mm;
            margin-bottom: 1mm;
        }

        .card-title {
            font-weight: 700;
            font-size: 9.5pt;
            font-variant: small-caps;
            color: #111115;
            margin: 0;
            line-height: 1.1;
        }

        .card-subtitle {
            font-size: 7pt;
            color: #5c101c;
            font-style: italic;
            margin: 0.5mm 0 0 0;
        }

        .card-meta {
            font-size: 6.5pt;
            color: #333333;
            margin-bottom: 1mm;
            font-weight: 600;
        }

        .card-desc {
            font-size: 6pt;
            line-height: 1.15;
            color: #222222;
            overflow: hidden;
            flex-grow: 1;
        }

        .card-footer {
            border-top: 1px dotted #cccccc;
            padding-top: 1mm;
            margin-top: 1mm;
            display: flex;
            justify-content: space-between;
            font-size: 6pt;
            font-weight: bold;
            color: #444444;
        }

        /* Ocultar controles al imprimir */
        @media print {
            body {
                background: none;
                padding: 0;
            }
            .no-print {
                display: none;
            }
            .a4-page {
                margin: 0;
                box-shadow: none;
                page-break-after: always;
            }
        }
    </style>
</head>
<body>

    <div class="no-print">
        <h1>🖨️ Generador de Cartas Imprimibles V5</h1>
        <p>Cargando datos automáticamente desde Google Sheets... Organizado en cuadrículas de 3x3 (9 cartas por página A4).</p>
        <button onclick="window.print()">Imprimir Páginas A4</button>
    </div>

    <!-- Contenedor donde se inyectarán las páginas A4 con las cartas -->
    <div id="printContainer"></div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQaQJuLj6_QRdKghfXWQFV5NThMJF-tXWJDIRJiwShVfbusDaCsQbHL-ZFHL-NaB4DF9MCllinL6RfA/pub?gid=0&single=true&output=csv';

        // Mapeo exacto de los nombres de disciplinas a tus archivos de iconos en /iconos/
        const ICONOS_MAP = {
            'Animalismo': 'Animalism_symbol.png',
            'Auspex': 'Auspex_symbol.png',
            'Celeridad': 'Celerity_symbol.png',
            'Dominación': 'Dominate_symbol.png',
            'Fortaleza': 'Fortitude_symbol.png',
            'Hechicería de Sangre': 'Blood_Sorcery_symbol.png',
            'Ofuscación': 'Obfuscate_symbol.png',
            'Olvido': 'Oblivion_symbol.png',
            'Potencia': 'Potence_symbol.png',
            'Presencia': 'Presence_symbol.png',
            'Protean': 'Protean_symbol.png',
            'Alquimia de Sangre Débil': 'Alchemy_symbol.png'
        };

        Papa.parse(CSV_URL, {
            download: true,
            header: false,
            skipEmptyLines: true,
            complete: function(results) {
                const filas = results.data;
                
                // Procesar filas de la hoja (asumiendo el mismo orden que usamos en el compendio)
                const datos = filas.slice(1).map(row => {
                    return {
                        nombre: (row[0] || '').trim(),
                        disciplina: (row[2] || '').trim(),
                        nivel: (row[3] || '').trim(),
                        coste: (row[7] || '').trim(),
                        reservaDados: (row[8] || '').trim(),
                        descripcion: (row[12] || '').trim()
                    };
                }).filter(item => item.nombre && item.nombre.toLowerCase() !== 'nombre poder');

                const container = document.getElementById('printContainer');
                container.innerHTML = '';

                let currentPage = null;
                let cardsOnCurrentPage = 0;

                datos.forEach((item, index) => {
                    // Si no hay página activa o ya tiene 9 cartas, creamos una nueva página A4
                    if (cardsOnCurrentPage === 0) {
                        currentPage = document.createElement('div');
                        currentPage.className = 'a4-page';
                        container.appendChild(currentPage);
                    }

                    const iconoArchivo = ICONOS_MAP[item.disciplina] || 'VTM-Ank.png';
                    
                    const cartaEl = document.createElement('div');
                    cartaEl.className = 'carta';
                    cartaEl.innerHTML = `
                        <img src="./iconos/${iconoArchivo}" class="logo-fondo" alt="Logo">
                        <div class="contenido-carta">
                            <div>
                                <div class="card-header">
                                    <h2 class="card-title">${item.nombre}</h2>
                                    <p class="card-subtitle">${item.disciplina} • Nivel ${item.nivel || '-'}</p>
                                </div>
                                ${item.reservaDados && item.reservaDados !== '-' ? `<div class="card-meta">🎲 ${item.reservaDados}</div>` : ''}
                                <div class="card-desc">${item.descripcion}</div>
                            </div>
                            <div class="card-footer">
                                <span>Coste: ${item.coste && item.coste !== '-' ? item.coste : 'Ninguno'}</span>
                                <span>V5</span>
                            </div>
                        </div>
                    `;

                    currentPage.appendChild(cartaEl);
                    cardsOnCurrentPage++;

                    // Al llegar a 9 cartas, cerramos la página actual
                    if (cardsOnCurrentPage === 9) {
                        cardsOnCurrentPage = 0;
                    }
                });
            }
        });
    </script>
</body>
</html>
